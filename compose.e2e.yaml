# E2E joins only the project-scoped Compose network. It deliberately removes
# host port publishing so concurrent local work cannot be reached or disrupted.
services:
  db:
    ports: !reset []
  api:
    ports: !reset []
  web:
    ports: !reset []
    # The old console's browser suites still open its / and its alerts, triage and war room (#870).
    environment:
      LEGACY_CONSOLE: keep
