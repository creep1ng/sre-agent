services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [runtime]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [runtime]

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [runtime]

  seed:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "sre_agent.persistence.seeds"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [runtime]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [runtime]

  python-checks:
    profiles: ["checks"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: checks
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTEST_ADDOPTS: -p no:cacheprovider
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [runtime]

  harness:
    profiles: ["harness", "checks"]
    build:
      context: .
      dockerfile: docker/harness.Dockerfile
    command:
      ["npm", "--prefix", "schemas/tooling", "run", "conformance", "--", "--consumer", "issue-10"]
    volumes:
      - ./schemas:/source/schemas:ro
      - ./scripts:/source/scripts:ro
    tmpfs:
      - /workspace:rw,nosuid,size=512m,uid=1000,gid=1000,mode=0755
    restart: "no"
    networks: [runtime]

volumes:
  postgres_data:

networks:
  runtime:
