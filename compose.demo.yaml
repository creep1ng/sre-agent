# External composition overlay for the pinned OpenTelemetry Demo.
# Passed last, so its values win. See demo/manifest.yaml for the environment.
# Uses !reset and !override, so it requires Docker Compose 2.24.4 or later.
#
# Upstream mounts ./src/flagd, inside its own checkout, as the flagd config
# directory. Injecting a failure by editing that file would modify the demo,
# which the issue contract forbids. This overlay replaces the mount with a
# working copy the project owns, created by scripts/demo_env.py from the
# upstream definitions. DEMO_FLAGS_DIR is an absolute path set by that script.
#
# Upstream also publishes most services on an ephemeral host port: the short
# syntax "3000" binds every host interface to a random port. That exposed
# Grafana with anonymous Admin, OpenSearch, flagd-ui and the store database
# outside the proxy, a bypass of both the proxy and Grafana MCP. Only the ports
# declared in demo/manifest.yaml stay published; the rest are reset below.

services:
  flagd:
    volumes:
      - ${DEMO_FLAGS_DIR:?run operations through scripts/demo_env.py}:/etc/flagd
    ports: !reset []

  # The flagd provider in checkout kept a cached evaluation after flagd
  # restarted, so the store went on failing after reset until checkout itself
  # was restarted. Evaluating on every call lets fail and reset take effect
  # without touching checkout.
  checkout:
    environment:
      FLAGD_CACHE: disabled
    ports: !reset []
    # Upstream caps checkout and product-catalog at 20M, which their binary and
    # files fill as page cache: both re-read from disk without pause, the host's
    # load reached ~30 on 8 CPUs, product-catalog's p95 15 s, and Midnight's rules
    # fired on the cascade with nothing injected (#765). 64M ends it.
    deploy: &page-cache-headroom
      resources:
        limits:
          memory: 64M

  # Grafana MCP: read-only, minimal tool categories, caller authentication and
  # no published port. It joins the demo network to reach Grafana and a
  # dedicated internal network reserved for the gateway (#187). The harness
  # joins neither, and never receives the caller token.
  grafana-mcp:
    image: grafana/mcp-grafana:1.3.0
    container_name: grafana-mcp
    command:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      - --allowed-hosts=grafana-mcp:8000
      - --disable-write
      - --enabled-tools=prometheus,elasticsearch,datasource
    environment:
      GRAFANA_URL: http://grafana:3000/grafana
      GRAFANA_ORG_ID: "1"
    env_file:
      - ${DEMO_STATE_DIR:?run operations through scripts/demo_env.py}/grafana-mcp.env
    depends_on:
      grafana:
        condition: service_started
    restart: unless-stopped
    networks: [default, mcp-boundary]

  # The demo's second enrolled service (#721): a checkout of our own, beside the store. It
  # cannot be named `checkout` here: it would merge with the store's service and answer for
  # its DNS name. The release lives in the image, never on the container, so a rollback by
  # the deploy-executor keeps the version it rolled back to. `demo_env.py fail|reset
  # --service sre-checkout` picks the release through DEMO_CHECKOUT_VERSION.
  sre-checkout:
    image: demo/checkout:${DEMO_CHECKOUT_VERSION:-1.4.0}
    build:
      context: ../docker
      dockerfile: checkout.Dockerfile
      args:
        CHECKOUT_VERSION: ${DEMO_CHECKOUT_VERSION:-1.4.0}
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # The two declared ports, bound to the loopback interface. Upstream publishes
  # them on every interface, which put Grafana's anonymous Admin session and the
  # Envoy admin interface on whatever network the host is attached to. The admin
  # interface is no longer published at all: no acceptance criterion uses it and
  # it can drain or stop the proxy.
  frontend-proxy:
    ports: !override
      - "127.0.0.1:${ENVOY_PORT}:${ENVOY_PORT}"

  prometheus:
    ports: !override
      - "127.0.0.1:${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"

  ad: {ports: !reset []}
  astronomy-db: {ports: !reset []}
  cart: {ports: !reset []}
  currency: {ports: !reset []}
  email: {ports: !reset []}
  flagd-ui: {ports: !reset []}
  frontend: {ports: !reset []}
  # Midnight's alert rules and webhook contact point (#765). Grafana reads its provisioning from
  # a directory of its own: a file mounted inside upstream's provisioning mount would make Docker
  # create its mountpoint in the upstream checkout. Upstream's datasources and dashboards stay;
  # its alerting files (an email contact point and two example rules) give way to ours. The
  # secret is the one demo_env.py generates; Grafana joins the gateway's network only to post
  # its alerts to the API's intake.
  grafana:
    ports: !reset []
    environment:
      GF_PATHS_PROVISIONING: /etc/midnight-provisioning
      ALERT_INTAKE_URL: ${ALERT_INTAKE_URL:-http://api:8000/v1/alert-intake/grafana}
    env_file:
      - ${DEMO_STATE_DIR:?run operations through scripts/demo_env.py}/alert-intake.env
    volumes:
      - ./src/grafana/provisioning/datasources:/etc/midnight-provisioning/datasources:ro
      - ./src/grafana/provisioning/dashboards:/etc/midnight-provisioning/dashboards:ro
      - ../demo/grafana/alerting:/etc/midnight-provisioning/alerting:ro
    networks: [default, mcp-boundary]
  image-provider: {ports: !reset []}
  jaeger: {ports: !reset []}
  opensearch: {ports: !reset []}
  otel-collector: {ports: !reset []}
  payment:
    ports: !reset []
    # Node auto-instrumentation also runs in the upstream healthcheck process.
    healthcheck:
      timeout: 20s
  product-catalog:
    ports: !reset []
    deploy: *page-cache-headroom
  quote: {ports: !reset []}
  recommendation: {ports: !reset []}
  shipping: {ports: !reset []}
  telemetry-docs: {ports: !reset []}
  valkey-cart: {ports: !reset []}

networks:
  mcp-boundary:
    name: sre-mcp-boundary
    internal: true
