# Deterministic fixture — the same incident once declared.
#
# Complements initial-state.yaml by exercising the far side of the session rule:
# from `active` onward the incident_id exists and the full correlation triple
# (incident_id, run_id, task_id) is populated, matching what the gateway accepts.
---
workflow_id: incident-response
workflow_version: 1.0.0
incident_id: inc-otel-payment-failure
linked_incident_id: null
run_id: run-001
task_id: step-000
state: investigating
process_stage: null
severity: sev2
impact: Checkout completion is failing for synthetic traffic.

alert:
  alert_id: alt-payment-error-rate
  service: paymentservice
  severity: sev2
  status: triaged
  observed_at: '2026-08-24T14:05:00Z'
  summary: >-
    Elevated error rate on paymentservice calls originating from checkoutservice.
  source: grafana-alerting
  origin:
    signal: traces_span_metrics_calls_total
    condition: error rate above threshold over a five minute window
    detector: webstore-metrics
    observed_at: '2026-08-24T14:04:30Z'

hypotheses:
  - hypothesis_id: hyp_payment_flag
    statement: A feature flag is forcing the payment service to fail.
    confidence: medium
    status: open
    supporting_evidence: [ev_payment_error_rate]
    contradicting_evidence: []
    next_check: Inspect the flagd configuration for paymentFailure.
    created_by: agent
    created_at: '2026-08-24T14:12:00Z'

mitigation_strategy: null
postmortem: null

evidence:
  - evidence_id: ev_payment_error_rate
    source: grafana-mcp
    tool: query_prometheus
    datasource_uid: prometheus
    query: sum(rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
    time_window: last 15 minutes
    summary: Error rate on paymentservice rose sharply and stayed elevated.
    collected_at: '2026-08-24T14:10:00Z'
    request_id: 3f2c1d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
    audit_event_id: null
    trusted: false

decisions:
  - decision_id: dec_declare
    decision_point: triage_outcome
    outcome: declare
    rationale: Sustained customer-facing failure in checkout.
    actor: human
    transition_id: triage_declare
    request_id: null
    audit_event_id: null
    decided_at: '2026-08-24T14:08:00Z'

approvals: []

timeline:
  - event_id: evt_declared
    kind: state_change
    from_state: triage
    to_state: active
    reference_id: inc-otel-payment-failure
    actor: human
    request_id: null
    audit_event_id: null
    note: Incident declared and war room opened.
    occurred_at: '2026-08-24T14:08:00Z'

authorized_capabilities:
  - resource_type: llm_model
    resource_id: triage-agent
    action: invoke
  - resource_type: mcp_tool
    resource_id: query_prometheus
    action: invoke

updated_at: '2026-08-24T14:12:00Z'
