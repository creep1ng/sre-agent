openapi: 3.1.0
info:
  title: SRE Agent Audit Events API
  version: 1.0.0
  description: >-
    Audit read surface for LLM responses.create evidence (HT-AUDIT-READ,
    issue #188), consumed by the admin audit UI (issue #25). Auth is
    admin.read on administrative_control/audit, re-evaluated on every page.
    Filters apply in storage before pagination over occurred_at DESC,
    event_id DESC within from <= occurred_at < to (from < to, max 7 days,
    UTC). The cursor is opaque, versioned, tamper-protected, bound to
    normalized filters + limit + continuation, TTL 15 min; an invalid,
    expired, or filter-reused cursor is 422. Detail returns the closed
    AuditMetadata projection. No MCP/Skill/BoK transversal, no incident
    timeline. 503 audit_unavailable never returns an empty list.
servers: [{ url: / }]
security: [{ bearerAuth: [] }]

paths:
  /v1/audit/events:
    get:
      summary: List audit metadata events
      operationId: listAuditEvents
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: request_id, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: outcome, in: query, required: false, schema: { type: string, enum: [success, denied, error] } }
        - { name: stage, in: query, required: false, schema: { type: string, enum: [validation, authentication, authorization, routing, upstream, response, audit] } }
        - { name: principal_digest, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: principal_key_version, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: resource_digest, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: resource_key_version, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 2000 } }
      responses:
        '200':
          description: Audit metadata page (items may be empty)
          content:
            application/json:
              schema: { $ref: 'urn:sre-agent:schema:audit-events-page:1.0.0' }
              examples:
                current: { $ref: './examples/audit-read/events-page.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/CursorRejected' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }

  /v1/audit/events/{event_id}:
    get:
      summary: Read one audit metadata event
      operationId: getAuditEvent
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Closed audit metadata projection
          content:
            application/json:
              schema: { $ref: 'urn:sre-agent:schema:audit-metadata:1.0.0' }
              examples:
                current: { $ref: './examples/audit-read/event-detail.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Missing or invalid bearer credential
      content:
        application/json:
          schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.0.0' }
    Forbidden:
      description: Authenticated without admin.read on administrative_control/audit
      content:
        application/json:
          schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.0.0' }
    NotFound:
      description: Unknown event_id
      content:
        application/json:
          schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.0.0' }
    CursorRejected:
      description: Invalid, expired, or filter-reused cursor
      content:
        application/json:
          schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.0.0' }
          examples:
            current: { $ref: './examples/audit-read/error-422.json' }
    AuditUnavailable:
      description: Audit storage unavailable; never an empty list
      content:
        application/json:
          schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.0.0' }
          examples:
            current: { $ref: './examples/audit-read/error-503.json' }
