# Audit events page — HT-AUDIT-READ (issue #188). Items plus cursor.
---
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:sre-agent:schema:audit-events-page:1.0.0
type: object
additionalProperties: false
required: [items, limit, next_cursor]
properties:
  items:
    type: array
    maxItems: 100
    items: { $ref: 'urn:sre-agent:schema:audit-metadata:1.0.0' }
  limit: { type: integer, minimum: 1, maximum: 100 }
  next_cursor: { type: [string, "null"], maxLength: 2000, default: null }
