# Public incident snapshot returned to authorized readers — HT-INC-RUNTIME-B (issue #189).
#
# GET /v1/incidents/{incident_id}/snapshot. The latest persisted snapshot of the
# selected run, projected safe: the incident detail plus a bounded run summary,
# the aggregate version covered and the event sequence covered. Rebuilding from
# snapshot + later events is the runtime's replay; this document only reports it.
# Every property declared here must be registered in
# agent/api/projection-policy.v1.yaml (allow-list, fail closed).
---
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:sre-agent:schema:incident-snapshot:1.0.0
title: IncidentSnapshot
type: object
additionalProperties: false
required: [snapshot_id, incident_id, run_id, version, event_sequence, incident,
           run, created_at]
properties:
  snapshot_id:
    type: string
    pattern: '^snap_[a-z0-9]{8,32}$'
  incident_id:
    type: string
    pattern: '^[a-z][a-z0-9_-]{2,63}$'
  run_id:
    type: string
    pattern: '^run_[a-z0-9]{8,32}$'
  version:
    type: integer
    minimum: 0
    description: Aggregate version covered by this snapshot.
  event_sequence:
    type: integer
    minimum: 0
    description: Highest run event sequence covered by this snapshot.
  incident:
    $ref: './incident-detail.schema.yaml'
  run:
    type: object
    additionalProperties: false
    required: [run_id, version]
    properties:
      run_id:
        type: string
        pattern: '^run_[a-z0-9]{8,32}$'
      version:
        type: integer
        minimum: 0
      status:
        type: [string, "null"]
        enum: [running, awaiting_human, completed, terminated, null]
        default: null
      current_state:
        type: [string, "null"]
        default: null
      updated_at:
        type: [string, "null"]
        format: date-time
        default: null
  created_at:
    type: string
    format: date-time
