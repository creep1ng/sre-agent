$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:sre-agent:schema:triage-context:1.0.0
title: AlertTriageContext
type: object
additionalProperties: false
required: [alert_id, triage_state, allowed_actions]
properties:
  alert_id: { type: string, pattern: '^[a-z][a-z0-9_-]{2,63}$' }
  triage_state:
    oneOf:
      - { $ref: 'urn:sre-agent:schema:triage-state:2.0.0' }
      - { type: "null" }
  allowed_actions:
    type: array
    maxItems: 4
    uniqueItems: true
    items:
      enum: [open_triage, triage_dismiss, triage_link, triage_declare]
