# Sensitive execution context — HT-INC-04 (issue #145), audit finding C07.
#
# GET /v1/incidents/{incident_id}/runs/{run_id}/context
#
# This is the counterpart of the safe projection, not an extension of it. It may carry
# what the UI snapshot must never carry: the assembled context, the tool arguments and
# the model output. It is therefore behind its own endpoint and its own action
# (run.read_context), so a principal can watch a run without being able to read what was
# sent to the model.
#
# Credentials are absent by construction, not by redaction: the harness never holds a
# provider secret, so there is none to project.
---
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:sre-agent:schema:run-context:1.0.0
title: RunContext
type: object
additionalProperties: false
required: [run_id, incident_id, turns, retrieved_at]
properties:
  run_id:
    type: string
    pattern: '^run_[a-z0-9]{8,32}$'
  incident_id:
    type: string
    pattern: '^[a-z][a-z0-9_-]{2,63}$'
  turns:
    type: array
    items: { $ref: '#/$defs/turn' }
  retrieved_at:
    type: string
    format: date-time
  reasoning:
    description: >-
      Additive and optional for 1.0.0 readers. What the incident holds from the
      investigation: the hypotheses, the evidence they cite and the proposed mitigation,
      as the runtime validated and recorded them (not the raw model output above). It
      belongs to the incident, so every run of the incident reads the same artifacts.
      It lives here, behind run.read_context, because it is the model's reasoning in
      prose and the queries it ran: the safe projection never carries it.
    $ref: '#/$defs/reasoning'

$defs:
  reasoning:
    type: object
    additionalProperties: false
    required: [hypotheses, evidence, mitigation_strategy]
    properties:
      hypotheses:
        type: array
        items: { $ref: '#/$defs/hypothesis' }
      evidence:
        type: array
        items: { $ref: '#/$defs/evidence' }
      mitigation_strategy:
        oneOf:
          - type: "null"
          - $ref: '#/$defs/mitigationStrategy'

  # The three shapes below are the allow-listed subset of incident-state 1.0.0.
  hypothesis:
    type: object
    additionalProperties: false
    required: [hypothesis_id, statement, confidence]
    properties:
      hypothesis_id: { type: string, pattern: '^hyp_[a-z0-9_-]{1,60}$' }
      statement: { type: string, minLength: 1, maxLength: 4000 }
      confidence: { enum: [low, medium, high] }
      status: { enum: [open, supported, refuted, superseded] }
      supporting_evidence:
        type: array
        items: { type: string, pattern: '^ev_[a-z0-9_-]{1,60}$' }
      contradicting_evidence:
        type: array
        items: { type: string, pattern: '^ev_[a-z0-9_-]{1,60}$' }
      next_check: { type: [string, "null"], maxLength: 1000 }
      created_by: { enum: [human, agent] }
      created_at: { type: string, format: date-time }

  evidence:
    type: object
    additionalProperties: false
    required: [evidence_id, source, summary]
    properties:
      evidence_id: { type: string, pattern: '^ev_[a-z0-9_-]{1,60}$' }
      source: { type: string, minLength: 1, maxLength: 200 }
      tool: { type: [string, "null"], maxLength: 200 }
      datasource_uid: { type: [string, "null"], maxLength: 200 }
      query: { type: [string, "null"], maxLength: 4000 }
      time_window: { type: [string, "null"], maxLength: 200 }
      summary: { type: string, minLength: 1, maxLength: 8000 }
      collected_at: { type: string, format: date-time }
      request_id:
        description: The governed gateway request that returned this evidence.
        type: [string, "null"]
        format: uuid
      # Additive for 1.0.0 readers: incident-state 1.2.0's evidence verdict (issue #707).
      empty: { type: boolean }
      verdict: { enum: [supports, contradicts, inconclusive, null] }
      finding: { type: [string, "null"], maxLength: 300 }

  mitigationStrategy:
    type: object
    additionalProperties: false
    required: [mitigation_id, description, steps, risk, verification_check, approval_status]
    properties:
      mitigation_id: { type: string, pattern: '^mit_[a-z0-9_-]{1,60}$' }
      description: { type: string, minLength: 1, maxLength: 4000 }
      steps:
        type: array
        minItems: 1
        items: { type: string, minLength: 1, maxLength: 1000 }
      risk: { enum: [low, medium, high] }
      expected_effect: { type: [string, "null"], maxLength: 2000 }
      verification_check: { type: string, minLength: 1, maxLength: 2000 }
      approval_status: { enum: [pending, approved, rejected, changes_requested] }
      execution_mode: { enum: [simulated, human] }
      based_on_hypothesis: { type: [string, "null"], pattern: '^hyp_[a-z0-9_-]{1,60}$' }
      created_by: { enum: [human, agent] }
      created_at: { type: string, format: date-time }

  turn:
    type: object
    additionalProperties: false
    required: [turn_id, task_id, sequence, occurred_at]
    properties:
      turn_id:
        type: string
        pattern: '^turn_[a-z0-9]{8,32}$'
      task_id:
        description: The gateway correlation derived by replacing turn_ with task_ (C05).
        oneOf:
          - type: "null"
          - type: string
            pattern: '^[a-z][a-z0-9_-]{2,63}$'
            not: { pattern: '^turn_' }
      sequence:
        type: integer
        minimum: 0
      assembled_input:
        type: [string, "null"]
        maxLength: 65536
        default: null
        description: >-
          The single string sent to the gateway as `input`. Bounded by the same limit the
          gateway enforces, so the context cannot describe a request the gateway would
          have rejected.
      model_output:
        type: [string, "null"]
        maxLength: 65536
        default: null
        description: The assistant text returned for this turn, before parsing.
      tool_invocation:
        oneOf:
          - type: "null"
          - $ref: '#/$defs/toolInvocation'
        default: null
      request_id:
        type: [string, "null"]
        format: uuid
        default: null
      occurred_at:
        type: string
        format: date-time

  toolInvocation:
    description: >-
      What the harness asked a governed tool for. Arguments live here and never in the
      safe projection, because a query can carry filters that identify people.
    type: object
    additionalProperties: false
    required: [tool, arguments]
    properties:
      tool:
        type: string
        minLength: 1
        maxLength: 200
      arguments:
        type: object
      result_summary:
        type: [string, "null"]
        maxLength: 8000
        default: null
        description: >-
          Bounded summary of what came back. The raw payload is not projected even here:
          it is re-fetchable from the tool through the gateway, so persisting it would add
          exposure without adding capability.
