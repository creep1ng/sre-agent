<rect x="0" y="0" width="220" height="900" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="24" dy="0">Control Plane</tspan></text><text x="24" y="57" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">single-workspace MVP</tspan></text><rect x="16" y="108" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="130" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Overview</tspan></text><rect x="16" y="150" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="172" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Principals</tspan></text><rect x="16" y="192" width="188" height="34" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/><text x="28" y="214" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Resources &amp; Aliases</tspan></text><rect x="16" y="234" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="256" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Grants</tspan></text><rect x="16" y="276" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="298" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Audit &amp; Consumption</tspan></text><rect x="16" y="318" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="340" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Limits &amp; Budget</tspan></text><text x="24" y="820" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">Guardrails</tspan></text><text x="24" y="844" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start"><tspan x="24" dy="0">No roles</tspan><tspan x="24" dy="16">No organizations</tspan><tspan x="24" dy="16">No SSO</tspan></text><rect x="220" y="0" width="1180" height="64" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="248" y="30" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="248" dy="0">LLM Alias Detail</tspan></text><text x="248" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="248" dy="0">Control Plane / Resources &amp; Aliases / triage-agent</tspan></text><rect x="1225" y="18" width="104" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="1235" y="37" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="1235" dy="0">low / medium</tspan></text><rect x="252" y="96" width="820" height="138" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="270" y="132" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start"><tspan x="270" dy="0">triage-agent</tspan></text><text x="270" y="160" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="270" dy="0">Logical alias managed by the control plane</tspan></text><rect x="270" y="182" width="70" height="28" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="280" y="201" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#047857" text-anchor="start"><tspan x="280" dy="0">active</tspan></text><rect x="932" y="114" width="98" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="946" y="137" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start"><tspan x="946" dy="0">Deactivate</tspan></text><rect x="252" y="260" width="400" height="250" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="268" y="288" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">Assignment</tspan></text><text x="268" y="314" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Alias</tspan></text><rect x="268" y="324" width="352" height="38" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="280" y="348" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start"><tspan x="280" dy="0">triage-agent</tspan></text><text x="268" y="384" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Effective model</tspan></text><rect x="268" y="394" width="352" height="38" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="280" y="418" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start"><tspan x="280" dy="0">anthropic/claude-sonnet-4</tspan></text><text x="268" y="454" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Provider</tspan></text><rect x="268" y="464" width="220" height="38" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="280" y="488" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start"><tspan x="280" dy="0">openrouter / anthropic</tspan></text><rect x="500" y="464" width="133" height="36" rx="8" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="514" y="487" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#fff" text-anchor="start"><tspan x="514" dy="0">Save assignment</tspan></text><rect x="672" y="260" width="400" height="250" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="688" y="288" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="688" dy="0">Routing explanation</tspan></text><rect x="708" y="328" width="100" height="48" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="758" y="357" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="758" dy="0">Harness</tspan></text><rect x="828" y="328" width="100" height="48" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="878" y="357" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="878" dy="0">Gateway</tspan></text><rect x="948" y="328" width="112" height="48" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="1004" y="357" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="1004" dy="0">Model + provider</tspan></text><line x1="808" y1="352" x2="828" y2="352" stroke="#6B7280" stroke-width="2"/><line x1="928" y1="352" x2="948" y2="352" stroke="#6B7280" stroke-width="2"/><text x="708" y="404" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start"><tspan x="708" dy="0">Request model = triage-agent</tspan></text><text x="708" y="432" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start"><tspan x="708" dy="0">Gateway resolves the alias. The harness does not pick the provider directly.</tspan></text><rect x="1096" y="92" width="272" height="776" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1112" y="120" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Annotations</tspan></text><text x="1112" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">API</tspan></text><text x="1112" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• GET /v1/model-aliases</tspan></text><text x="1112" y="185" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• GET /v1/model-aliases/{id}</tspan></text><text x="1112" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• PUT /v1/model-</tspan></text><text x="1112" y="219" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  aliases/{id}/assignment</tspan></text><text x="1112" y="236" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• PUT /v1/model-aliases/{id}/status</tspan></text><text x="1112" y="263" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Data</tspan></text><text x="1112" y="283" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• alias</tspan></text><text x="1112" y="300" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• concrete_model</tspan></text><text x="1112" y="317" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• inference_provider</tspan></text><text x="1112" y="334" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• status</tspan></text><text x="1112" y="361" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">UX rules</tspan></text><text x="1112" y="381" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• triage-agent is not a Principal.</tspan></text><text x="1112" y="398" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Show effective model + provider.</tspan></text><text x="1112" y="415" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Open question: provider optional</tspan></text><text x="1112" y="432" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  vs required.</tspan></text>
</svg>