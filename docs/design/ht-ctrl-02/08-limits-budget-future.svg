<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#F8FAFC"/>
<title>08 - Limits &amp; Budget (Future)</title>
<rect x="0" y="0" width="220" height="900" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="24" dy="0">Control Plane</tspan></text><text x="24" y="57" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">single-workspace MVP</tspan></text><rect x="16" y="108" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="130" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Overview</tspan></text><rect x="16" y="150" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="172" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Principals</tspan></text><rect x="16" y="192" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="214" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Resources &amp; Aliases</tspan></text><rect x="16" y="234" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="256" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Grants</tspan></text><rect x="16" y="276" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="298" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Audit &amp; Consumption</tspan></text><rect x="16" y="318" width="188" height="34" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/><text x="28" y="340" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Limits &amp; Budget</tspan></text><text x="24" y="820" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">Guardrails</tspan></text><text x="24" y="844" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start"><tspan x="24" dy="0">No roles</tspan><tspan x="24" dy="16">No organizations</tspan><tspan x="24" dy="16">No SSO</tspan></text><rect x="220" y="0" width="1180" height="64" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="248" y="30" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="248" dy="0">Limits &amp; Budget</tspan></text><text x="248" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="248" dy="0">Control Plane / Future surfaces</tspan></text><rect x="1225" y="18" width="104" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="1235" y="37" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="1235" dy="0">low / medium</tspan></text><text x="252" y="110" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="252" dy="0">Reserved future surface — not implemented in Sprint 1</tspan></text><text x="252" y="136" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="252" dy="0">Space is reserved now so later stories do not reintroduce role-based quota models.</tspan></text><rect x="252" y="176" width="400" height="210" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="268" y="206" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">Incident session limit</tspan></text><text x="268" y="238" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Scope</tspan></text><text x="268" y="260" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">incident_id</tspan></text><text x="268" y="298" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Max per session</tspan></text><rect x="268" y="308" width="200" height="38" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="280" y="332" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start"><tspan x="280" dy="0">TBD</tspan></text><text x="268" y="370" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="268" dy="0">Open decision: unit of measure.</tspan></text><rect x="672" y="176" width="400" height="210" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="688" y="206" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start"><tspan x="688" dy="0">Monthly workspace budget</tspan></text><text x="688" y="244" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="688" dy="0">Monthly cap</tspan></text><rect x="688" y="254" width="200" height="38" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="700" y="278" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start"><tspan x="700" dy="0">$ TBD</tspan></text><text x="688" y="314" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="688" dy="0">Current usage</tspan></text><rect x="688" y="324" width="200" height="38" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="700" y="348" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start"><tspan x="700" dy="0">$ 0.00</tspan></text><text x="688" y="370" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="688" dy="0">Future administrative surface only.</tspan></text><rect x="252" y="426" width="820" height="132" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="268" y="454" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">Why it appears now</tspan></text><text x="268" y="486" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">#56 requires the administrative surface to exist conceptually. #57 reserves the UI without implementing limits or budget logic.</tspan></text><rect x="1096" y="92" width="272" height="776" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1112" y="120" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Annotations</tspan></text><text x="1112" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Status</tspan></text><text x="1112" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Future surface only.</tspan></text><text x="1112" y="185" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Not implemented in Sprint 1.</tspan></text><text x="1112" y="212" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Open decisions</tspan></text><text x="1112" y="232" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Define per-session limit unit.</tspan></text><text x="1112" y="249" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Define monthly budget source of</tspan></text><text x="1112" y="266" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  truth.</tspan></text><text x="1112" y="293" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">UX rules</tspan></text><text x="1112" y="313" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Keep separate from grants.</tspan></text><text x="1112" y="330" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• No role-based quotas.</tspan></text><text x="1112" y="347" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Scope = workspace + incident</tspan></text><text x="1112" y="364" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  session.</tspan></text>
</svg>