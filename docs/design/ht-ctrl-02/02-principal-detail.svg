<rect x="0" y="0" width="220" height="900" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="24" dy="0">Control Plane</tspan></text><text x="24" y="57" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">single-workspace MVP</tspan></text><rect x="16" y="108" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="130" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Overview</tspan></text><rect x="16" y="150" width="188" height="34" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/><text x="28" y="172" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Principals</tspan></text><rect x="16" y="192" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="214" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Resources &amp; Aliases</tspan></text><rect x="16" y="234" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="256" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Grants</tspan></text><rect x="16" y="276" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="298" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Audit &amp; Consumption</tspan></text><rect x="16" y="318" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="340" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Limits &amp; Budget</tspan></text><text x="24" y="820" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">Guardrails</tspan></text><text x="24" y="844" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start"><tspan x="24" dy="0">No roles</tspan><tspan x="24" dy="16">No organizations</tspan><tspan x="24" dy="16">No SSO</tspan></text><rect x="220" y="0" width="1180" height="64" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="248" y="30" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="248" dy="0">Principal Detail</tspan></text><text x="248" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="248" dy="0">Control Plane / Principals / mario-admin</tspan></text><rect x="1225" y="18" width="104" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="1235" y="37" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="1235" dy="0">low / medium</tspan></text><rect x="252" y="96" width="820" height="132" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="270" y="130" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start"><tspan x="270" dy="0">mario-admin</tspan></text><text x="270" y="156" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="270" dy="0">Display name: Mario</tspan></text><rect x="270" y="174" width="70" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="280" y="193" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="280" dy="0">human</tspan></text><rect x="350" y="174" width="70" height="28" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="360" y="193" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#047857" text-anchor="start"><tspan x="360" dy="0">active</tspan></text><rect x="850" y="112" width="98" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="864" y="135" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start"><tspan x="864" dy="0">Deactivate</tspan></text><rect x="952" y="112" width="98" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="966" y="135" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start"><tspan x="966" dy="0">View Audit</tspan></text><rect x="252" y="252" width="76" height="28" rx="14" fill="#111827" stroke="#111827" stroke-width="1"/><text x="262" y="271" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#fff" text-anchor="start"><tspan x="262" dy="0">Overview</tspan></text><rect x="362" y="252" width="97" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="372" y="271" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="372" dy="0">Credentials</tspan></text><rect x="472" y="252" width="70" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="482" y="271" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="482" dy="0">Grants</tspan></text><rect x="582" y="252" width="70" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="592" y="271" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="592" dy="0">Audit</tspan></text><rect x="252" y="304" width="390" height="190" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="268" y="330" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">Current status</tspan></text><text x="268" y="360" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Identity is active and can authenticate</tspan><tspan x="268" dy="17">if a valid credential exists.</tspan></text><text x="268" y="418" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Separate actions</tspan></text><text x="268" y="442" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">• replace status</tspan><tspan x="268" dy="17">• revoke credentials</tspan><tspan x="268" dy="17">• revoke grants</tspan></text><rect x="666" y="304" width="406" height="190" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="682" y="330" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="682" dy="0">Navigation shortcuts</tspan></text><rect x="682" y="354" width="140" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="696" y="377" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start"><tspan x="696" dy="0">Open Credentials</tspan></text><rect x="840" y="354" width="105" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="854" y="377" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start"><tspan x="854" dy="0">Open Grants</tspan></text><rect x="682" y="406" width="98" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="696" y="429" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start"><tspan x="696" dy="0">Open Audit</tspan></text><text x="682" y="462" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="682" dy="0">Open Grants/Audit with this Principal preselected.</tspan></text><rect x="1096" y="92" width="272" height="776" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1112" y="120" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Annotations</tspan></text><text x="1112" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">API</tspan></text><text x="1112" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• GET /v1/principals/{id}</tspan></text><text x="1112" y="185" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• PUT /v1/principals/{id}/status</tspan></text><text x="1112" y="212" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Data</tspan></text><text x="1112" y="232" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• principal_id</tspan></text><text x="1112" y="249" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• kind</tspan></text><text x="1112" y="266" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• display_name</tspan></text><text x="1112" y="283" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• status</tspan></text><text x="1112" y="300" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• timestamps</tspan></text><text x="1112" y="327" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">UX rules</tspan></text><text x="1112" y="347" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Status change must not imply</tspan></text><text x="1112" y="364" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  credential/grant cascade.</tspan></text><text x="1112" y="381" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Keep Credentials, Grants and Audit</tspan></text><text x="1112" y="398" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  separate.</tspan></text>
</svg>