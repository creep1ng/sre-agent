<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#F8FAFC"/>
<title>00 - Overview</title>
<rect x="0" y="0" width="220" height="900" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="24" dy="0">Control Plane</tspan></text><text x="24" y="57" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">single-workspace MVP</tspan></text><rect x="16" y="108" width="188" height="34" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/><text x="28" y="130" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Overview</tspan></text><rect x="16" y="150" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="172" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Principals</tspan></text><rect x="16" y="192" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="214" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Resources &amp; Aliases</tspan></text><rect x="16" y="234" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="256" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Grants</tspan></text><rect x="16" y="276" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="298" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Audit &amp; Consumption</tspan></text><rect x="16" y="318" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="340" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Limits &amp; Budget</tspan></text><text x="24" y="820" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">Guardrails</tspan></text><text x="24" y="844" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start"><tspan x="24" dy="0">No roles</tspan><tspan x="24" dy="16">No organizations</tspan><tspan x="24" dy="16">No SSO</tspan></text><rect x="220" y="0" width="1180" height="64" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="248" y="30" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="248" dy="0">Control Plane Wireframes</tspan></text><text x="248" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="248" dy="0">HT-CTRL-02 / Navigation / Guardrails</tspan></text><rect x="1225" y="18" width="104" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="1235" y="37" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="1235" dy="0">low / medium</tspan></text><text x="252" y="110" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start"><tspan x="252" dy="0">Navigation and vocabulary</tspan></text><text x="252" y="136" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="252" dy="0">Contract-first wireframe anchor for the administrative control plane.</tspan></text><rect x="252" y="170" width="370" height="150" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="268" y="196" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">Identity</tspan></text><text x="268" y="226" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">Principal</tspan></text><text x="268" y="256" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">human | agent</tspan><tspan x="268" dy="17">Credentials belong to a Principal</tspan><tspan x="268" dy="17">No role or organization required</tspan></text><rect x="640" y="170" width="370" height="150" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="656" y="196" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="656" dy="0">Authorization</tspan></text><text x="656" y="226" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="656" dy="0">Grant</tspan></text><text x="656" y="256" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="656" dy="0">Principal + action + resource</tspan><tspan x="656" dy="17">Effect = allow</tspan><tspan x="656" dy="17">Missing active grant = deny</tspan></text><rect x="252" y="340" width="370" height="150" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="268" y="366" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">Model routing</tspan></text><text x="268" y="396" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">triage-agent</tspan></text><text x="268" y="426" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">Logical alias, not identity</tspan><tspan x="268" dy="17">Gateway resolves model + provider</tspan><tspan x="268" dy="17">Harness keeps requesting triage-agent</tspan></text><rect x="640" y="340" width="370" height="150" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="656" y="366" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="656" dy="0">Future surfaces</tspan></text><text x="656" y="396" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="656" dy="0">Limits &amp; Budget</tspan></text><text x="656" y="426" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="656" dy="0">Reserve space only</tspan><tspan x="656" dy="17">incident_id session limit</tspan><tspan x="656" dy="17">monthly workspace budget</tspan></text><text x="252" y="530" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start"><tspan x="252" dy="0">Priority screen set</tspan></text><text x="268" y="560" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">• Principals list and detail</tspan></text><text x="268" y="586" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">• Credentials with one-time secret state</tspan></text><text x="268" y="612" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">• Resources catalog and alias detail</tspan></text><text x="268" y="638" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">• Grants with create/revoke and deny example</tspan></text><text x="268" y="664" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">• Audit and consumption with filter-first UX</tspan></text><text x="268" y="690" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="268" dy="0">• Future limits and budget surface</tspan></text><rect x="1096" y="92" width="272" height="776" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1112" y="120" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Annotations</tspan></text><text x="1112" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Purpose</tspan></text><text x="1112" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Summarize vocabulary before</tspan></text><text x="1112" y="185" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  individual screens.</tspan></text><text x="1112" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Keep #57 aligned with #56.</tspan></text><text x="1112" y="229" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Rules</tspan></text><text x="1112" y="249" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Never show user -&gt; role -&gt;</tspan></text><text x="1112" y="266" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  permissions.</tspan></text><text x="1112" y="283" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Never show triage-agent as a</tspan></text><text x="1112" y="300" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  Principal.</tspan></text><text x="1112" y="317" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Harness never chooses provider</tspan></text><text x="1112" y="334" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  directly.</tspan></text><text x="1112" y="361" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Sprint</tspan></text><text x="1112" y="381" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Sprint 1: wireframes + API notes.</tspan></text><text x="1112" y="398" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Sprint 2: implementation stories.</tspan></text>
</svg>