troke-width="1"/><text x="698" y="442" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#991B1B" text-anchor="start"><tspan x="698" dy="0">Error / denial example</tspan></text><text x="698" y="478" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#991B1B" text-anchor="start"><tspan x="698" dy="0">Access unavailable</tspan></text><text x="698" y="512" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="698" dy="0">This Principal has no active grant for action = query</tspan><tspan x="698" dy="17">and resource = runbooks-core.</tspan></text><text x="698" y="570" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#991B1B" text-anchor="start"><tspan x="698" dy="0">Effective rule</tspan></text><text x="698" y="594" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#991B1B" text-anchor="start"><tspan x="698" dy="0">No active grant =&gt; deny</tspan></text><rect x="1096" y="92" width="272" height="776" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1112" y="120" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Annotations</tspan></text><text x="1112" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">API</tspan></text><text x="1112" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• GET /v1/grants?principal_id=... or</tspan></text><text x="1112" y="185" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  resource_id=...</tspan></text><text x="1112" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• POST /v1/grants</tspan></text><text x="1112" y="219" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• DELETE /v1/grants/{id}</tspan></text><text x="1112" y="246" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Data</tspan></text><text x="1112" y="266" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• grant_id</tspan></text><text x="1112" y="283" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• principal_id</tspan></text><text x="1112" y="300" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• action</tspan></text><text x="1112" y="317" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• resource.type</tspan></text><text x="1112" y="334" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• resource.id</tspan></text><text x="1112" y="351" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• status</tspan></text><text x="1112" y="378" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">UX rules</tspan></text><text x="1112" y="398" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Never model access with roles.</tspan></text><text x="1112" y="415" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Principal, action, resource stay</tspan></text><text x="1112" y="432" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  distinct.</tspan></text><text x="1112" y="449" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Prefer contextual entry.</tspan></text>
