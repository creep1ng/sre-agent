<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#F8FAFC"/>
<title>03 - Credentials</title>
<rect x="0" y="0" width="220" height="900" rx="0" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="24" dy="0">Control Plane</tspan></text><text x="24" y="57" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">single-workspace MVP</tspan></text><rect x="16" y="108" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="130" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Overview</tspan></text><rect x="16" y="150" width="188" height="34" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/><text x="28" y="172" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Principals</tspan></text><rect x="16" y="192" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="214" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Resources &amp; Aliases</tspan></text><rect x="16" y="234" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="256" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Grants</tspan></text><rect x="16" y="276" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="298" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Audit &amp; Consumption</tspan></text><rect x="16" y="318" width="188" height="34" rx="8" fill="#F9FAFB" stroke="#F9FAFB" stroke-width="1"/><text x="28" y="340" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Limits &amp; Budget</tspan></text><text x="24" y="820" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="24" dy="0">Guardrails</tspan></text><text x="24" y="844" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#374151" text-anchor="start"><tspan x="24" dy="0">No roles</tspan><tspan x="24" dy="16">No organizations</tspan><tspan x="24" dy="16">No SSO</tspan></text><rect x="220" y="0" width="1180" height="64" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="248" y="30" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="248" dy="0">Credentials</tspan></text><text x="248" y="50" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="248" dy="0">Control Plane / Principals / mario-admin / Credentials</tspan></text><rect x="1225" y="18" width="104" height="28" rx="14" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="1235" y="37" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#374151" text-anchor="start"><tspan x="1235" dy="0">low / medium</tspan></text><text x="252" y="110" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="252" dy="0">API key management</tspan></text><text x="252" y="134" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="252" dy="0">Secret is shown only once on successful issue / rotation.</tspan></text><rect x="252" y="154" width="119" height="36" rx="8" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="266" y="177" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#fff" text-anchor="start"><tspan x="266" dy="0">Issue API key</tspan></text><rect x="382" y="154" width="133" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="396" y="177" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start"><tspan x="396" dy="0">Rotate selected</tspan></text><rect x="252" y="214" width="390" height="190" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="268" y="240" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="268" dy="0">Empty state</tspan></text><rect x="268" y="266" width="358" height="120" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/><text x="300" y="304" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start"><tspan x="300" dy="0">No credentials issued yet</tspan></text><text x="300" y="332" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="300" dy="0">Create the first API key for this Principal.</tspan></text><rect x="300" y="344" width="119" height="36" rx="8" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="314" y="367" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#fff" text-anchor="start"><tspan x="314" dy="0">Issue API key</tspan></text><rect x="666" y="214" width="406" height="280" rx="12" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="682" y="240" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="682" dy="0">Issue result state</tspan></text><rect x="682" y="266" width="374" height="210" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="700" y="298" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#065F46" text-anchor="start"><tspan x="700" dy="0">Credential issued</tspan></text><text x="700" y="326" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#065F46" text-anchor="start"><tspan x="700" dy="0">Copy this secret now. It will not be displayed again.</tspan></text><text x="700" y="350" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="700" dy="0">Secret</tspan></text><rect x="700" y="360" width="324" height="38" rx="8" fill="#fff" stroke="#D1D5DB" stroke-width="1"/><text x="712" y="384" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start"><tspan x="712" dy="0">sk-live-****************</tspan></text><rect x="700" y="422" width="105" height="36" rx="8" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="714" y="445" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#fff" text-anchor="start"><tspan x="714" dy="0">Copy secret</tspan></text><rect x="820" y="422" width="140" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="834" y="445" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#111827" text-anchor="start"><tspan x="834" dy="0">I have stored it</tspan></text><rect x="252" y="442" width="820" height="40" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="264.0" y="467" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="264.0" dy="0">Credential ID</tspan></text><text x="428.0" y="467" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="428.0" dy="0">Created</tspan></text><text x="592.0" y="467" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="592.0" dy="0">Expires</tspan></text><text x="756.0" y="467" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="756.0" dy="0">Status</tspan></text><text x="920.0" y="467" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="920.0" dy="0">Action</tspan></text><rect x="252" y="482" width="820" height="40" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="264.0" y="507" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="264.0" dy="0">cred-01</tspan></text><text x="428.0" y="507" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="428.0" dy="0">2026-08-15</tspan></text><text x="592.0" y="507" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="592.0" dy="0">null</tspan></text><text x="756.0" y="507" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="756.0" dy="0">active</tspan></text><text x="920.0" y="507" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="920.0" dy="0">Rotate / Revoke</tspan></text><rect x="252" y="522" width="820" height="40" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="264.0" y="547" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="264.0" dy="0">cred-00</tspan></text><text x="428.0" y="547" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="428.0" dy="0">2026-08-10</tspan></text><text x="592.0" y="547" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="592.0" dy="0">2026-08-12</tspan></text><text x="756.0" y="547" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="756.0" dy="0">revoked</tspan></text><text x="920.0" y="547" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="920.0" dy="0">View metadata</tspan></text><rect x="1096" y="92" width="272" height="776" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1112" y="120" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Annotations</tspan></text><text x="1112" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">API</tspan></text><text x="1112" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• GET</tspan></text><text x="1112" y="185" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  /v1/principals/{id}/credentials</tspan></text><text x="1112" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• POST</tspan></text><text x="1112" y="219" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  /v1/principals/{id}/credentials</tspan></text><text x="1112" y="236" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• POST /v1/credentials/{id}/rotation</tspan></text><text x="1112" y="253" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• DELETE /v1/credentials/{id}</tspan></text><text x="1112" y="280" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">UX rules</tspan></text><text x="1112" y="300" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• One-time copy state is mandatory.</tspan></text><text x="1112" y="317" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Later views show metadata only.</tspan></text><text x="1112" y="334" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Replay never redisplays secret.</tspan></text>
</svg>