827" text-anchor="start"><tspan x="615.4285714285714" dy="0">triage-agent</tspan></text><text x="732.5714285714286" y="513" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="732.5714285714286" dy="0">—</tspan></text><text x="849.7142857142857" y="513" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="849.7142857142857" dy="0">—</tspan></text><text x="966.8571428571429" y="513" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="966.8571428571429" dy="0">INC-42</tspan></text><rect x="252" y="528" width="820" height="40" rx="0" fill="#fff" stroke="#E5E7EB" stroke-width="1"/><text x="264.0" y="553" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="264.0" dy="0">11:50</tspan></text><text x="381.1428571428571" y="553" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="381.1428571428571" dy="0">triage-runner</tspan></text><text x="498.2857142857143" y="553" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="498.2857142857143" dy="0">allow</tspan></text><text x="615.4285714285714" y="553" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="615.4285714285714" dy="0">triage-agent</tspan></text><text x="732.5714285714286" y="553" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="732.5714285714286" dy="0">anthropic/cla…</tspan></text><text x="849.7142857142857" y="553" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="849.7142857142857" dy="0">openrouter</tspan></text><text x="966.8571428571429" y="553" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="966.8571428571429" dy="0">INC-41</tspan></text><text x="252" y="576" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="252" dy="0">Detail opens a metadata-only view with request_id, run_id, task_id and routing evidence.</tspan></text><rect x="1096" y="92" width="272" height="776" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1112" y="120" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Annotations</tspan></text><text x="1112" y="148" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">API</tspan></text><text x="1112" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• GET /v1/audit-events with &gt;=1</tspan></text><text x="1112" y="185" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  filter</tspan></text><text x="1112" y="202" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• GET /v1/audit-events/{id}</tspan></text><text x="1112" y="219" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Consumption source is still an</tspan></text><text x="1112" y="236" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  open contract.</tspan></text><text x="1112" y="263" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">Data</tspan></text><text x="1112" y="283" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• principal_id</tspan></text><text x="1112" y="300" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• decision</tspan></text><text x="1112" y="317" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• model_alias_id</tspan></text><text x="1112" y="334" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• effective model</tspan></text><text x="1112" y="351" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• provider</tspan></text><text x="1112" y="368" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• request_id</tspan></text><text x="1112" y="385" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• incident_id / run_id / task_id</tspan></text><text x="1112" y="412" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="start"><tspan x="1112" dy="0">UX rules</tspan></text><text x="1112" y="432" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• No global list without filter.</tspan></text><text x="1112" y="449" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• No raw prompt viewer.</tspan></text><text x="1112" y="466" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">• Reserve consumption metrics</tspan></text><text x="1112" y="483" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="1112" dy="0">  without inventing backend.</tspan></text>
