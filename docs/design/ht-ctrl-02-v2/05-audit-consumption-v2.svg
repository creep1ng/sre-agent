<svg xmlns="http://www.w3.org/2000/svg" width="1586" height="992" viewBox="0 0 1586 992"><rect width="1586" height="992" fill="#FFFFFF"/><title>05 Audit &amp; Consumption</title><rect x="0" y="0" width="230" height="992" rx="0" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/><text x="28" y="48" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Control Plane</tspan></text><text x="28" y="75" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="28" dy="0">single-workspace MVP</tspan></text><text x="28" y="142" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Principals</tspan></text><text x="28" y="202" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Resources &amp; aliases</tspan></text><text x="28" y="262" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Grants</tspan></text><rect x="15" y="296" width="196" height="44" rx="7" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/><text x="28" y="322" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Audit &amp; consumption</tspan></text><text x="28" y="835" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Guardrails</tspan></text><text x="28" y="866" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="28" dy="0">No roles</tspan><tspan x="28" dy="16">No organizations</tspan><tspan x="28" dy="16">No SSO</tspan></text><rect x="230" y="0" width="1038" height="96" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="260" y="44" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="260" dy="0">Audit &amp; consumption</tspan></text><text x="260" y="72" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="260" dy="0">Control Plane / Audit &amp; consumption</tspan></text><rect x="1085" y="25" width="116" height="28" rx="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="1143.0" y="44" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4B5563" text-anchor="middle"><tspan x="1143.0" dy="0">low / medium</tspan></text><text x="260" y="140" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start"><tspan x="260" dy="0">Inspect metadata-only events</tspan></text><text x="260" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="260" dy="0">Lightweight KPI strip above filters; semantic color is reserved for insight-bearing changes.</tspan></text><rect x="260" y="200" width="170" height="115" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="278" y="235" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="start"><tspan x="278" dy="0">Requests</tspan></text><text x="278" y="278" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827" text-anchor="start"><tspan x="278" dy="0">146</tspan></text><text x="278" y="300" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start"><tspan x="278" dy="0">stable window</tspan></text><rect x="445" y="200" width="170" height="115" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="463" y="235" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="start"><tspan x="463" dy="0">Tokens</tspan></text><text x="463" y="278" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827" text-anchor="start"><tspan x="463" dy="0">81k</tspan></text><text x="463" y="300" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#B45309" text-anchor="start"><tspan x="463" dy="0">near monthly guardrail</tspan></text><rect x="630" y="200" width="170" height="115" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/><text x="648" y="235" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="start"><tspan x="648" dy="0">Latency</tspan></text><text x="648" y="278" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827" text-anchor="start"><tspan x="648" dy="0">1.4 s</tspan></text><text x="648" y="300" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#047857" text-anchor="start"><tspan x="648" dy="0">within baseline</tspan></text><rect x="815" y="200" width="170" height="115" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="833" y="235" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="start"><tspan x="833" dy="0">Est. cost</tspan></text><text x="833" y="278" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#111827" text-anchor="start"><tspan x="833" dy="0">$6.12</tspan></text><text x="833" y="300" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start"><tspan x="833" dy="0">small spend</tspan></text><text x="260" y="360" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="260" dy="0">Principal</tspan></text><rect x="260" y="370" width="180" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="274" y="397" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="274" dy="0">mario-admin</tspan></text><text x="422" y="397" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle"><tspan x="422" dy="0">▾</tspan></text><text x="460" y="360" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="460" dy="0">Decision</tspan></text><rect x="460" y="370" width="165" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="474" y="397" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="474" dy="0">allow</tspan></text><text x="607" y="397" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle"><tspan x="607" dy="0">▾</tspan></text><text x="645" y="360" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="645" dy="0">Alias</tspan></text><rect x="645" y="370" width="190" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="659" y="397" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="659" dy="0">triage-agent</tspan></text><text x="817" y="397" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle"><tspan x="817" dy="0">▾</tspan></text><text x="855" y="360" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="855" dy="0">incident_id</tspan></text><rect x="855" y="370" width="170" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="869" y="397" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="869" dy="0">INC-42</tspan></text><text x="1007" y="397" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle"><tspan x="1007" dy="0">▾</tspan></text><rect x="1045" y="370" width="145" height="42" rx="7" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="1117.5" y="397" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="1117.5" dy="0">Apply filters</tspan></text><rect x="260" y="450" width="940" height="54" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="274" y="482" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="274" dy="0">Time</tspan></text><text x="364" y="482" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="364" dy="0">Principal</tspan></text><text x="524" y="482" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="524" dy="0">Decision</tspan></text><text x="644" y="482" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="644" dy="0">Alias</tspan></text><text x="794" y="482" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="794" dy="0">Model</tspan></text><text x="1014" y="482" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="1014" dy="0">Provider</tspan></text><text x="1134" y="482" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="1134" dy="0">incident_id</tspan></text><rect x="260" y="504" width="940" height="54" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="274" y="536" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="274" dy="0">12:03</tspan></text><text x="364" y="536" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="364" dy="0">mario-admin</tspan></text><rect x="522" y="516" width="68" height="28" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="556.0" y="535" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle"><tspan x="556.0" dy="0">allow</tspan></text><text x="644" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="644" dy="0">triage-agent</tspan></text><text x="794" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="794" dy="0">anthropic/claude-sonnet-4</tspan></text><text x="1014" y="536" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="1014" dy="0">openrouter</tspan></text><text x="1134" y="536" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="1134" dy="0">INC-42</tspan></text><rect x="260" y="558" width="940" height="54" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="274" y="590" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="274" dy="0">11:58</tspan></text><text x="364" y="590" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="364" dy="0">mario-admin</tspan></text><rect x="522" y="570" width="68" height="28" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/><text x="556.0" y="589" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle"><tspan x="556.0" dy="0">deny</tspan></text><text x="644" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="644" dy="0">triage-agent</tspan></text><text x="794" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="794" dy="0">—</tspan></text><text x="1014" y="590" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="1014" dy="0">—</tspan></text><text x="1134" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="1134" dy="0">INC-42</tspan></text><rect x="260" y="612" width="940" height="54" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="274" y="644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="274" dy="0">11:50</tspan></text><text x="364" y="644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="364" dy="0">triage-runner</tspan></text><rect x="522" y="624" width="68" height="28" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="556.0" y="643" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle"><tspan x="556.0" dy="0">allow</tspan></text><text x="644" y="644" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="644" dy="0">triage-agent</tspan></text><text x="794" y="644" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="794" dy="0">anthropic/claude-sonnet-4</tspan></text><text x="1014" y="644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="1014" dy="0">openrouter</tspan></text><text x="1134" y="644" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="1134" dy="0">INC-41</tspan></text><text x="260" y="700" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="start"><tspan x="260" dy="0">Selected event metadata</tspan></text><text x="260" y="737" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#111827" text-anchor="start"><tspan x="260" dy="0">request_9b8f...45f</tspan></text><text x="455" y="737" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#111827" text-anchor="start"><tspan x="455" dy="0">run_18</tspan></text><text x="545" y="737" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#111827" text-anchor="start"><tspan x="545" dy="0">task_4</tspan></text><text x="650" y="737" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="650" dy="0">provider: openrouter</tspan></text><text x="260" y="785" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="260" dy="0">Selecting a row opens metadata only: request_id, run_id, task_id, routing evidence, and timestamps.</tspan></text><rect x="1288" y="100" width="270" height="800" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1310" y="136" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Annotations</tspan></text><text x="1310" y="176" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Applied feedback</tspan></text><text x="1310" y="204" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Metrics appear above the filters.</tspan></text><text x="1310" y="223" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• The KPI tiles are lighter and only</tspan></text><text x="1310" y="242" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  highlight insight-bearing states.</tspan></text><text x="1310" y="261" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Decision uses semantic color.</tspan></text><text x="1310" y="280" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Alias, model, and incident_id are</tspan></text><text x="1310" y="299" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  monospace.</tspan></text><text x="1310" y="336" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Scope notes</tspan></text><text x="1310" y="364" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Audit remains metadata-only: no raw</tspan></text><text x="1310" y="383" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  prompt viewer.</tspan></text><text x="1310" y="402" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Consumption is shown only with</tspan></text><text x="1310" y="421" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  values that the backend can</tspan></text><text x="1310" y="440" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  realistically expose.</tspan></text><text x="1310" y="477" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Future surfaces</tspan></text><text x="1310" y="505" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Limits &amp; Budget stays conceptual in</tspan></text><text x="1310" y="524" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  documentation and is not rendered</tspan></text><text x="1310" y="543" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  as a product screen in this</tspan></text><text x="1310" y="562" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  iteration.</tspan></text></svg>