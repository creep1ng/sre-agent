nter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="790" dy="0">Create Principal dialog</tspan></text><text x="790" y="245" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="790" dy="0">Kind</tspan></text><rect x="790" y="255" width="230" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="804" y="282" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="804" dy="0">Human</tspan></text><text x="1002" y="282" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle"><tspan x="1002" dy="0">▾</tspan></text><text x="1040" y="245" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="1040" dy="0">Principal ID</tspan></text><rect x="1040" y="255" width="270" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="1054" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="1054" dy="0">user-admin</tspan></text><text x="790" y="320" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151" text-anchor="start"><tspan x="790" dy="0">Display name</tspan></text><rect x="790" y="330" width="520" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="804" y="357" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="804" dy="0">User Admin</tspan></text><rect x="790" y="495" width="180" height="42" rx="7" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="880.0" y="522" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="880.0" dy="0">Create Principal</tspan></text><rect x="50" y="620" width="1300" height="280" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="80" y="665" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="80" dy="0">Future note — Limits &amp; Budget</tspan></text><text x="80" y="700" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="80" dy="0">Reserved future surface only. Kept here as documentation, not as an active navigation target.</tspan></text><text x="80" y="760" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="start"><tspan x="80" dy="0">Potential future settings:</tspan></text><text x="80" y="800" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="80" dy="0">• Incident session limit (scoped by incident_id)</tspan></text><text x="80" y="835" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="80" dy="0">• Monthly workspace budget</tspan></text><text x="80" y="870" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="80" dy="0">• Both should avoid role-based quota semantics</tspan></text></svg>