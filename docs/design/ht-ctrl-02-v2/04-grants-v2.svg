ospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="524" dy="0">triage-agent</tspan></text><text x="762" y="242" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle"><tspan x="762" dy="0">▾</tspan></text><rect x="805" y="215" width="130" height="42" rx="7" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="870.0" y="242" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="870.0" dy="0">Create grant</tspan></text><rect x="260" y="290" width="940" height="54" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="274" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="274" dy="0">Grant ID</tspan></text><text x="414" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="414" dy="0">Principal</tspan></text><text x="594" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="594" dy="0">Action</tspan></text><text x="714" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="714" dy="0">Resource type</tspan></text><text x="894" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="894" dy="0">Resource ID</tspan></text><text x="1094" y="322" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="1094" dy="0">Status</tspan></text><rect x="260" y="344" width="940" height="54" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="274" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight=