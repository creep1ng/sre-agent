 fill="#374151" text-anchor="start"><tspan x="500" dy="0">Resource ID</tspan></text><rect x="500" y="690" width="190" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="514" y="717" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="514" dy="0">triage-agent</tspan></text><text x="672" y="717" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle"><tspan x="672" dy="0">▾</tspan></text><rect x="290" y="760" width="170" height="42" rx="7" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="375.0" y="787" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="375.0" dy="0">Create allow grant</tspan></text><rect x="750" y="525" width="450" height="245" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/><text x="780" y="565" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start"><tspan x="780" dy="0">Denial example</tspan></text><text x="780" y="610" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="start"><tspan x="780" dy="0">Access unavailable</tspan></text><text x="780" y="650" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#B91C1C" text-anchor="start"><tspan x="780" dy="0">No active grant matches</tspan><tspan x="780" dy="17">Principal = mario-admin</tspan><tspan x="780" dy="17">Action = query</tspan><tspan x="780" dy="17">Resource = runbooks-core</tspan></text><rect x="1288" y="100" width="270" height="800" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1310" y="136" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Annotations</tspan></text><text x="1310" y="176" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Applied feedback</tspan></text><text x="1310" y="204" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Principal and Resource filters are</tspan></text><text x="1310" y="223" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  comboboxes.</tspan></text><text x="1310" y="242" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• The create action is triggered by a</tspan></text><text x="1310" y="261" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  button that opens a dialog.</tspan></text><text x="1310" y="280" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Inline grant-creation card was</tspan></text><text x="1310" y="299" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  removed.</tspan></text><text x="1310" y="318" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Denial remains a compact inline</tspan></text><text x="1310" y="337" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  alert/example.</tspan></text><text x="1310" y="374" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Implementation notes</tspan></text><text x="1310" y="402" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Grant IDs and resource IDs are</tspan></text><text x="1310" y="421" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  monospace.</tspan></text><text x="1310" y="440" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Status uses semantic color.</tspan></text><text x="1310" y="459" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Final UI should translate the</tspan></text><text x="1310" y="478" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  action text into real buttons, menu</tspan></text><text x="1310" y="497" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  items, or dialogs.</tspan></text></svg>