 Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="894" dy="0">incident-triage</tspan></text><rect x="1092" y="410" width="68" height="28" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="1126.0" y="429" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle"><tspan x="1126.0" dy="0">active</tspan></text><rect x="260" y="452" width="940" height="54" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="274" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="274" dy="0">grant-03</tspan></text><text x="414" y="484" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="414" dy="0">mario-admin</tspan></text><text x="594" y="484" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="594" dy="0">query</tspan></text><text x="714" y="484" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="714" dy="0">bok_collection</tspan></text><text x="894" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="894" dy="0">runbooks-core</tspan></text><rect x="1092" y="464" width="73" height="28" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/><text x="1128.5" y="483" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle"><tspan x="1128.5" dy="0">revoked</tspan></text><rect x="260" y="525" width="460" height="300" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="290" y="565" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x=