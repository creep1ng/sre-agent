<svg xmlns="http://www.w3.org/2000/svg" width="1586" height="992" viewBox="0 0 1586 992"><rect width="1586" height="992" fill="#FFFFFF"/><title>02 Credential Management</title><rect x="0" y="0" width="230" height="992" rx="0" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/><text x="28" y="48" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Control Plane</tspan></text><text x="28" y="75" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="28" dy="0">single-workspace MVP</tspan></text><rect x="15" y="116" width="196" height="44" rx="7" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="1"/><text x="28" y="142" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start"><tspan x="28" dy="0">Principals</tspan></text><text x="28" y="202" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Resources &amp; aliases</tspan></text><text x="28" y="262" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Grants</tspan></text><text x="28" y="322" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Audit &amp; consumption</tspan></text><text x="28" y="835" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="28" dy="0">Guardrails</tspan></text><text x="28" y="866" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="28" dy="0">No roles</tspan><tspan x="28" dy="16">No organizations</tspan><tspan x="28" dy="16">No SSO</tspan></text><rect x="230" y="0" width="1038" height="96" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="260" y="44" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start"><tspan x="260" dy="0">Credential management</tspan></text><text x="260" y="72" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="260" dy="0">Control Plane / Principals / mario-admin / Credentials</tspan></text><rect x="1085" y="25" width="116" height="28" rx="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="1143.0" y="44" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4B5563" text-anchor="middle"><tspan x="1143.0" dy="0">low / medium</tspan></text><text x="260" y="140" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start"><tspan x="260" dy="0">API key management for the selected Principal</tspan></text><text x="260" y="168" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="260" dy="0">One-time secret display is modeled as a dialog. Later views expose metadata only.</tspan></text><rect x="260" y="200" width="135" height="42" rx="7" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="327.5" y="227" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="327.5" dy="0">Issue API key</tspan></text><rect x="405" y="200" width="145" height="42" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="477.5" y="227" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="477.5" dy="0">Rotate selected</tspan></text><rect x="260" y="270" width="940" height="54" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/><text x="274" y="302" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="274" dy="0">Credential ID</tspan></text><text x="474" y="302" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="474" dy="0">Created</tspan></text><text x="654" y="302" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="654" dy="0">Expires</tspan></text><text x="844" y="302" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="844" dy="0">Status</tspan></text><text x="1024" y="302" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start"><tspan x="1024" dy="0">Action</tspan></text><rect x="260" y="324" width="940" height="54" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="274" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="274" dy="0">cred-01</tspan></text><text x="474" y="356" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="474" dy="0">2026-08-15</tspan></text><text x="654" y="356" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="654" dy="0"></tspan></text><rect x="842" y="336" width="68" height="28" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/><text x="876.0" y="355" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#047857" text-anchor="middle"><tspan x="876.0" dy="0">active</tspan></text><text x="1024" y="356" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="1024" dy="0">Rotate / Revoke</tspan></text><rect x="260" y="378" width="940" height="54" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="274" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="274" dy="0">cred-00</tspan></text><text x="474" y="410" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="474" dy="0">2026-08-10</tspan></text><text x="654" y="410" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="654" dy="0">2026-08-12</tspan></text><rect x="842" y="390" width="73" height="28" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/><text x="878.5" y="409" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle"><tspan x="878.5" dy="0">revoked</tspan></text><text x="1024" y="410" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="1024" dy="0">View metadata</tspan></text><rect x="260" y="432" width="940" height="54" rx="0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="274" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="274" dy="0">cred-07</tspan></text><text x="474" y="464" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="474" dy="0">2026-08-20</tspan></text><text x="654" y="464" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="654" dy="0">2026-08-29</tspan></text><rect x="842" y="444" width="115" height="28" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="899.5" y="463" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle"><tspan x="899.5" dy="0">expiring soon</tspan></text><text x="1024" y="464" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start"><tspan x="1024" dy="0">Rotate</tspan></text><rect x="676" y="337" width="78" height="28" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1"/><text x="715.0" y="356" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle"><tspan x="715.0" dy="0">never</tspan></text><rect x="664" y="409" width="82" height="28" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/><text x="705.0" y="428" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle"><tspan x="705.0" dy="0">expired</tspan></text><rect x="652" y="463" width="116" height="28" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="710.0" y="482" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle"><tspan x="710.0" dy="0">expiring soon</tspan></text><rect x="260" y="535" width="470" height="320" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/><text x="288" y="575" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="288" dy="0">Issue API key</tspan></text><text x="288" y="607" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="288" dy="0">Copy this secret now. It will not be shown again.</tspan></text><text x="288" y="655" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#111827" text-anchor="start"><tspan x="288" dy="0">Secret</tspan></text><rect x="288" y="672" width="410" height="46" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="305" y="701" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="305" dy="0">sk-live-******************</tspan></text><rect x="288" y="752" width="120" height="42" rx="7" fill="#111827" stroke="#D1D5DB" stroke-width="1"/><text x="348.0" y="779" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="348.0" dy="0">Copy secret</tspan></text><rect x="425" y="752" width="145" height="42" rx="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="497.5" y="779" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="497.5" dy="0">I have stored it</tspan></text><rect x="760" y="535" width="440" height="320" rx="0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/><text x="790" y="575" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start"><tspan x="790" dy="0">Metadata drawer</tspan></text><text x="790" y="615" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#111827" text-anchor="start"><tspan x="790" dy="0">cred-00</tspan></text><text x="790" y="660" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="790" dy="0">Created</tspan></text><text x="940" y="660" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="940" dy="0">2026-08-10</tspan></text><text x="790" y="702" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="790" dy="0">Expires</tspan></text><text x="940" y="702" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="940" dy="0">2026-08-12</tspan></text><text x="790" y="744" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="790" dy="0">Last used</tspan></text><text x="940" y="744" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="940" dy="0">2026-08-11 14:30 UTC</tspan></text><text x="790" y="786" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="790" dy="0">Status</tspan></text><rect x="940" y="766" width="86" height="28" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/><text x="983.0" y="785" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle"><tspan x="983.0" dy="0">revoked</tspan></text><text x="790" y="828" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start"><tspan x="790" dy="0">Rotated from</tspan></text><text x="940" y="828" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#111827" text-anchor="start"><tspan x="940" dy="0">cred-xx</tspan></text><rect x="1288" y="100" width="270" height="800" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1310" y="136" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Annotations</tspan></text><text x="1310" y="176" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Applied feedback</tspan></text><text x="1310" y="204" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• No nested cards: the issue flow is</tspan></text><text x="1310" y="223" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  a dialog, not a card inside another</tspan></text><text x="1310" y="242" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  card.</tspan></text><text x="1310" y="261" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• “View metadata” now has an explicit</tspan></text><text x="1310" y="280" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  drawer UI.</tspan></text><text x="1310" y="299" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Status uses semantic color.</tspan></text><text x="1310" y="318" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Expires values differentiate never,</tspan></text><text x="1310" y="337" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  expiring soon, and expired.</tspan></text><text x="1310" y="374" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start"><tspan x="1310" dy="0">Visual notes</tspan></text><text x="1310" y="402" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Credential IDs are monospace.</tspan></text><text x="1310" y="421" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Secret values are only visible in</tspan></text><text x="1310" y="440" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  the transient issue/rotate dialog.</tspan></text><text x="1310" y="459" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">• Table row actions should become</tspan></text><text x="1310" y="478" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  real buttons or an overflow menu in</tspan></text><text x="1310" y="497" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#92400E" text-anchor="start"><tspan x="1310" dy="0">  the final UI.</tspan></text></svg>