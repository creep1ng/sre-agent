<svg xmlns="http://www.w3.org/2000/svg" width="1586" height="992" viewBox="0 0 1586 992"><rect width="1586" height="992" fill="#FFFFFF"/><title>00 Review Summary</title><text x="48" y="72" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" fill="#111827" text-anchor="start"><tspan x="48" dy="0">HT-CTRL-02 — Review-driven revision (v2)</tspan></text><text x="48" y="111" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="48" dy="0">Changes applied from PR feedback: fewer routes, fewer cards, explicit dialogs, semantic color, and monospace IDs.</tspan></text><rect x="50" y="170" width="990" height="160" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="76" y="208" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start"><tspan x="76" dy="0">Removed</tspan></text><text x="76" y="242" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Overview as a functional page</tspan></text><text x="76" y="270" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Principal Detail as its own page</tspan></text><text x="76" y="298" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Resource-type card row</tspan></text><text x="570" y="242" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="570" dy="0">• Standalone Limits &amp; Budget screen</tspan></text><text x="570" y="270" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="570" dy="0">• Inline Create Grant form</tspan></text><rect x="50" y="355" width="990" height="160" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="76" y="393" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start"><tspan x="76" dy="0">Consolidated</tspan></text><text x="76" y="427" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Credentials lives inside a selected</tspan><tspan x="76" dy="17">Principal</tspan></text><text x="76" y="461" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Alias detail opens in a side panel</tspan></text><text x="570" y="427" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="570" dy="0">• Audit keeps filter, KPIs, and table on one</tspan><tspan x="570" dy="17">page</tspan></text><rect x="50" y="540" width="990" height="160" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="76" y="578" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start"><tspan x="76" dy="0">Made explicit</tspan></text><text x="76" y="612" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Issue API key dialog</tspan></text><text x="76" y="640" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Credential metadata drawer</tspan></text><text x="76" y="668" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• New resource dropdown + create dialog</tspan></text><text x="570" y="612" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="570" dy="0">• Create grant dialog</tspan></text><text x="570" y="640" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="570" dy="0">• Comboboxes for searchable entities</tspan></text><rect x="50" y="720" width="990" height="160" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="76" y="758" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start"><tspan x="76" dy="0">Visual rules</tspan></text><text x="76" y="792" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Principal ID / resource IDs / alias /</tspan><tspan x="76" dy="17">model are monospace</tspan></text><text x="76" y="826" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="76" dy="0">• Status and decision use semantic color</tspan></text><text x="570" y="792" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="570" dy="0">• Kind and resource type use an icon + label</tspan><tspan x="570" dy="17">pattern</tspan></text><text x="570" y="826" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start"><tspan x="570" dy="0">• Avoid cards inside cards</tspan></text><rect x="1105" y="170" width="405" height="710" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/><text x="1135" y="212" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1135" dy="0">Primary product surfaces</tspan></text><circle cx="1155" cy="262" r="23" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/><text x="1155" y="268" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="1155" dy="0">1</tspan></text><text x="1197" y="262" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1197" dy="0">Principals</tspan></text><text x="1197" y="290" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="1197" dy="0">List + expanded row with tabs</tspan></text><circle cx="1155" cy="377" r="23" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/><text x="1155" y="383" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="1155" dy="0">2</tspan></text><text x="1197" y="377" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1197" dy="0">Resources &amp; aliases</tspan></text><text x="1197" y="405" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="1197" dy="0">One route: table, dialog, alias panel</tspan></text><circle cx="1155" cy="492" r="23" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/><text x="1155" y="498" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="1155" dy="0">3</tspan></text><text x="1197" y="492" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1197" dy="0">Grants</tspan></text><text x="1197" y="520" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="1197" dy="0">List + dialog + denial state</tspan></text><circle cx="1155" cy="607" r="23" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/><text x="1155" y="613" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle"><tspan x="1155" dy="0">4</tspan></text><text x="1197" y="607" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1197" dy="0">Audit &amp; consumption</tspan></text><text x="1197" y="635" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="1197" dy="0">KPI strip + filters + audit table</tspan></text><line x1="1135" y1="680" x2="1480" y2="680" stroke="#D1D5DB" stroke-width="1"/><text x="1135" y="735" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start"><tspan x="1135" dy="0">Future-only note</tspan></text><text x="1135" y="772" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start"><tspan x="1135" dy="0">Limits &amp; Budget remains conceptual in docs,</tspan><tspan x="1135" dy="17">not as a standalone implemented screen.</tspan></text></svg>