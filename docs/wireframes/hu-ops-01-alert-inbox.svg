<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe HU-OPS-01 — bandeja de alertas simuladas</title>
  <desc id="desc">Wireframe de baja fidelidad con una bandeja de alertas a la izquierda y el detalle seleccionado a la derecha, conservando el contexto para iniciar triage.</desc>
  <rect width="1440" height="920" fill="#f7f7f8"/>
  <g fill="none" stroke="#30343f" stroke-width="2">
    <rect x="32" y="30" width="1376" height="70" rx="10" fill="#ffffff"/>
    <rect x="32" y="130" width="1376" height="110" rx="10" fill="#ffffff"/>
    <rect x="32" y="265" width="520" height="610" rx="10" fill="#ffffff"/>
    <rect x="576" y="265" width="832" height="610" rx="10" fill="#ffffff"/>
    <line x1="32" y1="332" x2="552" y2="332"/>
    <line x1="576" y1="360" x2="1408" y2="360"/>
    <line x1="576" y1="485" x2="1408" y2="485"/>
    <line x1="576" y1="615" x2="1408" y2="615"/>
    <line x1="576" y1="735" x2="1408" y2="735"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#30343f">
    <text x="64" y="73" font-size="24" font-weight="700">midnight.agent</text>
    <text x="1070" y="73" font-size="14">Tema</text>
    <rect x="1120" y="52" width="74" height="30" rx="15" fill="#e8e8ed" stroke="#30343f"/>
    <circle cx="1177" cy="67" r="11" fill="#30343f"/>
    <text x="1215" y="73" font-size="16">Atención a incidentes</text>

    <text x="64" y="167" font-size="14" letter-spacing="2">OPERACIONES</text>
    <text x="64" y="202" font-size="32" font-weight="700">Alertas</text>
    <text x="64" y="226" font-size="16">Identifica una señal, revisa contexto y decide cuál llevar a triage.</text>

    <text x="58" y="307" font-size="20" font-weight="700">Bandeja</text>
    <text x="432" y="307" font-size="14">4 alertas</text>

    <text x="602" y="307" font-size="14" letter-spacing="2">DETALLE DE ALERTA</text>
    <text x="602" y="338" font-size="24" font-weight="700">Latencia elevada en checkout</text>

    <text x="70" y="370" font-size="13" font-weight="700">SEV1 · CRÍTICA</text>
    <text x="70" y="400" font-size="18" font-weight="700">Latencia elevada en checkout</text>
    <text x="70" y="426" font-size="14">checkout-service · Nueva</text>
    <text x="420" y="426" font-size="13">24 ago · 14:42</text>

    <text x="70" y="475" font-size="13" font-weight="700">SEV2 · ALTA</text>
    <text x="70" y="505" font-size="18" font-weight="700">Aumento de errores de pago</text>
    <text x="70" y="531" font-size="14">payment-service · Nueva</text>

    <text x="70" y="580" font-size="13" font-weight="700">SEV2 · ALTA</text>
    <text x="70" y="610" font-size="18" font-weight="700">Timeouts en carrito</text>
    <text x="70" y="636" font-size="14">cart-service · En observación</text>

    <text x="70" y="685" font-size="13" font-weight="700">SEV3 · MEDIA</text>
    <text x="70" y="715" font-size="18" font-weight="700">Errores intermitentes en catálogo</text>
    <text x="70" y="741" font-size="14">frontend · Reconocida</text>

    <text x="602" y="398" font-size="14" font-weight="700">Servicio</text>
    <text x="602" y="425" font-size="16">checkout-service</text>
    <text x="920" y="398" font-size="14" font-weight="700">Fecha y hora</text>
    <text x="920" y="425" font-size="16">24 ago 2026 · 14:42</text>
    <text x="602" y="454" font-size="14">Fuente: Grafana (fixture)</text>

    <text x="602" y="525" font-size="18" font-weight="700">Contexto operacional</text>
    <text x="602" y="555" font-size="15">El p95 superó el umbral. La bandeja permanece visible mientras se revisa el detalle.</text>

    <text x="602" y="655" font-size="18" font-weight="700">Metadata de origen</text>
    <text x="602" y="685" font-size="15">La anomalía se muestra como metadata de la alerta; no tiene lifecycle ni entidad propia.</text>

    <text x="602" y="778" font-size="18" font-weight="700">Siguiente paso</text>
    <text x="602" y="808" font-size="15">HU-OPS-01 solo emite una solicitud de triage. No crea ni asocia incidentes.</text>
    <rect x="1152" y="780" width="210" height="52" rx="8" fill="#e8e8ed" stroke="#30343f"/>
    <text x="1205" y="813" font-size="16" font-weight="700">Iniciar triage</text>

    <text x="50" y="905" font-size="13">Responsive: en móvil, la bandeja y el detalle se apilan verticalmente sin eliminar la lista del contexto.</text>
  </g>
</svg>
