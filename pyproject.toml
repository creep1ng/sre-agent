[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agent"
version = "0.1.0"
description = "Runtime composition root for the SRE agent planes"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.115.12",
  "psycopg[binary]==3.2.6",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
