openapi: 3.1.0
info: { title: SRE Agent Control Plane API, version: 2.8.0, description: 'Canonical single-workspace governance contract. Authentication precedes lookup; hidden and absent resources are indistinguishable.' }
servers: [{ url: / }]
security: [{ bearerAuth: [] }]
tags: [{ name: Principals, description: Principal lifecycle operations. }, { name: Credentials, description: One-time issuance and credential lifecycle operations. }, { name: ModelAliases, description: Stable model alias assignment operations. }, { name: Grants, description: Direct allow Grant lifecycle operations. }, { name: Audit, description: Metadata-only audit projection operations. }, { name: Catalog, description: Closed owner-backed resource discovery and read projection. }]
paths:
  /v1/usage/requests:
    get:
      operationId: readUsageRequests
      summary: Read bounded historical request attribution
      description: >-
        Returns persisted per-request routing attribution and the existing
        authoritative consumption projection. Exactly one selector is required.
        Month is the UTC month of the earliest persisted responses.create event;
        related rows are deduplicated by request_id. At most 1000 matching evidence
        rows are inspected; oversized scopes fail rather than truncate. An older
        invocation with no persisted snapshot is reported as legacy; a request
        rejected before provider invocation without an assignment snapshot is
        unavailable. Neither status is reconstructed from the current alias.
        Reads do not create attribution or consumption evidence.
      x-maximum-evidence-rows: 1000
      x-required-query-one-of: [request_id, incident_id, month]
      x-reject-unknown-query-parameters: true
      x-governed-scope:
        action: admin.read
        resource_type: administrative_control
        resource_id: usage
      x-forbidden-query-parameters: [from, to, cursor, page, offset, continuation_token, prompt, output, api_key]
      parameters:
        - name: request_id
          in: query
          required: false
          schema:
            anyOf:
              - { type: string, format: uuid }
              - { type: 'null' }
        - name: incident_id
          in: query
          required: false
          schema:
            anyOf:
              - { type: string, minLength: 1, maxLength: 128 }
              - { type: 'null' }
        - name: month
          in: query
          required: false
          schema:
            anyOf:
              - { type: string, pattern: '^(?:(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-8][0-9]{3}|9[0-8][0-9]{2}|99[0-8][0-9]|999[0-8])-(?:0[1-9]|1[0-2])|9999-(?:0[1-9]|1[01]))$' }
              - { type: 'null' }
      responses:
        '200':
          description: Persisted request attribution with explicit legacy/unavailable states.
          content:
            application/json:
              schema:
                $ref: 'urn:sre-agent:schema:usage-requests:2.8.0'
        '401':
          description: Authentication failed; no request data or counts are returned.
          content:
            application/json:
              schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.8.0' }
        '403':
          description: Administrative read is not authorized; no request data or counts are returned.
          content:
            application/json:
              schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.8.0' }
        '413':
          description: The matching evidence exceeds the projection bound; no partial result is returned.
          content:
            application/json:
              schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.8.0' }
        '422':
          description: Selector is missing, malformed, repeated, or supplied with unknown filters.
          content:
            application/json:
              schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.8.0' }
        '503':
          description: Persisted request attribution could not be read; an empty result is not substituted.
          content:
            application/json:
              schema: { $ref: 'urn:sre-agent:schema:error-envelope:2.8.0' }
  /v1/usage/consumption:
    get:
      operationId: readUsageConsumption
      summary: Read persisted request consumption aggregates
      description: >-
        Reads only persisted consumption evidence. Exactly one bounded selector is
        required. Month selection uses the half-open UTC calendar interval from
        00:00:00Z on the first day through (but not including) the next month's
        first instant. An effective request is attributed only to the UTC month
        containing its earliest persisted responses.create occurred_at; all related
        rows for that request are included for deduplication and coverage, and later
        events do not create another month count. At most 1000 matching audit evidence
        rows are projected; larger scopes fail explicitly rather than silently
        truncating an aggregate. Reads do not create consumption evidence.
      x-maximum-evidence-rows: 1000
      x-required-query-one-of: [request_id, incident_id, month]
      x-governed-scope: { action: admin.read, resource_type: administrative_control, resource_id: usage }
      parameters:
        - { name: request_id, in: query, required: false, description: Return one effective request aggregate., schema: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] } }
        - { name: incident_id, in: query, required: false, description: Return distinct runs and requests in one incident., schema: { anyOf: [{ type: string, minLength: 1, maxLength: 128 }, { type: 'null' }] } }
        - { name: month, in: query, required: false, description: UTC calendar month in YYYY-MM form., schema: { anyOf: [{ type: string, pattern: '^(?:(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-8][0-9]{3}|9[0-8][0-9]{2}|99[0-8][0-9]|999[0-8])-(?:0[1-9]|1[0-2])|9999-(?:0[1-9]|1[01]))$' }, { type: 'null' }] } }
      x-forbidden-query-parameters: [from, to, cursor, page, offset, continuation_token, prompt, output, api_key]
      responses:
        '200': { description: 'Persisted usage projection with explicit evidence coverage.', content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:usage-read:2.8.0' } } } }
        '401': { description: Authentication failed; no usage data or counts are returned. }
        '403': { description: Administrative read is not authorized; no counts are returned. }
        '413': { description: The matching evidence exceeds the projection bound; no partial aggregate is returned. }
        '422': { description: 'Selector is missing, malformed, or supplied more than once.' }
        '503': { description: 'Persisted usage could not be read; an empty result is not substituted.' }
  /v1/principals:
    post:
      summary: Create a Principal
      operationId: createPrincipal
      tags: [Principals]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrincipalCreate' } } } }
      responses:
        '201': { description: Principal created or stable replay, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:principal:2.8.0' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
    get:
      summary: List Principals
      operationId: listPrincipals
      tags: [Principals]
      description: Ordered by (created_at,id) ascending. No continuation is available.
      x-forbidden-query-parameters: [cursor, page, offset, continuation_token, next]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Bounded principal list, content: { application/json: { schema: { $ref: '#/components/schemas/PrincipalList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/principals/{id}:
    get:
      summary: Get a Principal
      operationId: getPrincipal
      tags: [Principals]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Principal, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:principal:2.8.0' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/principals/{id}/status:
    put:
      summary: Replace Principal status
      operationId: replacePrincipalStatus
      tags: [Principals]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrincipalStatusReplace' } } } }
      responses:
        '200': { description: Deterministically replaced Principal status, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:principal:2.8.0' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/principals/{id}/credentials:
    post:
      summary: Issue a credential
      operationId: issueCredential
      tags: [Credentials]
      description: Reveals the key only on first success; replay omits it and sets secret_revealed=false.
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialIssue' } } } }
      responses:
        '201': { description: Credential issuance or stable replay, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:credential-issuance:2.8.0' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalFailure' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
    get:
      summary: List credential metadata
      operationId: listCredentials
      tags: [Credentials]
      description: Metadata only, ordered by (created_at,id) descending. No hash, key, or continuation.
      x-forbidden-query-parameters: [cursor, page, offset, continuation_token, next]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Bounded credential list, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/credentials/{id}:
    delete:
      summary: Revoke a credential
      operationId: revokeCredential
      tags: [Credentials]
      description: Converges on revoked; repetition creates no transition and reveals no secret.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Credential is revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/credentials/{id}/rotation:
    post:
      summary: Rotate a credential
      operationId: rotateCredential
      tags: [Credentials]
      description: Atomically revokes the old credential and creates one replacement. Failure leaves the old credential active.
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialIssue' } } } }
      responses:
        '201': { description: Replacement rotation result or stable replay, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:credential-rotation:2.8.0' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RotationConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/model-aliases:
    post:
      summary: Create a ModelAlias
      operationId: createModelAlias
      tags: [ModelAliases]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModelAliasCreate' } } } }
      responses:
        '201': { description: ModelAlias created or stable replay, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:model-alias:2.8.0' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
    get:
      summary: List ModelAliases
      operationId: listModelAliases
      tags: [ModelAliases]
      description: Ordered by (created_at,id) ascending. No continuation is available.
      x-forbidden-query-parameters: [cursor, page, offset, continuation_token, next]
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Bounded ModelAlias list, content: { application/json: { schema: { $ref: '#/components/schemas/ModelAliasList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/model-aliases/{id}:
    get:
      summary: Get a ModelAlias
      operationId: getModelAlias
      tags: [ModelAliases]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: ModelAlias, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:model-alias:2.8.0' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/model-aliases/{id}/assignment:
    put:
      summary: Replace ModelAlias assignment
      operationId: replaceModelAliasAssignment
      tags: [ModelAliases]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ModelAliasAssignment' } } } }
      responses:
        '200': { description: Deterministically replaced assignment, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:model-alias:2.8.0' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/model-aliases/{id}/status:
    put:
      summary: Replace ModelAlias status
      operationId: replaceModelAliasStatus
      tags: [ModelAliases]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActiveInactiveStatus' } } } }
      responses:
        '200': { description: Deterministically replaced ModelAlias status, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:model-alias:2.8.0' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StatusConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/grants:
    post:
      summary: Create a direct allow Grant
      operationId: createGrant
      tags: [Grants]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GrantCreate' } } } }
      responses:
        '201': { description: Direct allow Grant created or stable replay, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:grant:2.8.0' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
    get:
      summary: List filtered Grants
      operationId: listGrants
      tags: [Grants]
      description: Requires principal_id or resource_id; ordered by (created_at,id) descending. No continuation.
      x-required-query-any-of: [principal_id, resource_id]
      x-forbidden-query-parameters: [cursor, page, offset, continuation_token, next]
      parameters: [{ $ref: '#/components/parameters/PrincipalFilter' }, { $ref: '#/components/parameters/ResourceFilter' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: Bounded filtered Grant list, content: { application/json: { schema: { $ref: '#/components/schemas/GrantList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/grants/{id}:
    delete:
      summary: Revoke a Grant
      operationId: revokeGrant
      tags: [Grants]
      description: Converges on revoked; repetition creates no transition.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Grant is revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/audit-events/{id}:
    get:
      summary: Get audit metadata
      operationId: getAuditEvent
      tags: [Audit]
      description: Metadata and redaction state only. Raw or redacted content retrieval is unsupported.
      parameters: [{ $ref: '#/components/parameters/AuditEventId' }]
      responses:
        '200': { description: Metadata-only AuditEvent projection, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:audit-event-metadata:2.8.0' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/audit-events:
    get:
      summary: List filtered audit metadata
      operationId: listAuditEvents
      tags: [Audit]
      description: Requires a listed identity, decision, alias, correlation, or bounded-time filter; ordered by (occurred_at,event_id) descending. Content parameters are rejected.
      x-required-query-any-of: [principal_id, decision, model_alias_id, request_id, incident_id, run_id, task_id, trace_id, from, to]
      x-forbidden-query-parameters: [cursor, page, offset, continuation_token, next, content, raw_content, redacted_content, include_content]
      parameters:
        - { $ref: '#/components/parameters/PrincipalFilter' }
        - { name: decision, in: query, schema: { enum: [allow, deny] } }
        - { name: model_alias_id, in: query, schema: { type: string } }
        - { name: request_id, in: query, schema: { type: string, format: uuid } }
        - { name: incident_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: task_id, in: query, schema: { type: string } }
        - { name: trace_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Bounded metadata-only AuditEvent list, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/catalog/resources:
    post:
      summary: Create a catalog resource
      operationId: createCatalogResource
      tags: [Catalog]
      description: ADMIN-authoritative closed create for non-llm catalog resources. llm_model stays owned by ModelAliasCreate and is rejected here. Same Idempotency-Key replay/conflict contract as alias and grant creates.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogCreate' } } } }
      responses:
        '201': { description: Catalog resource created or stable replay, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:resource-catalog-entry:2.8.0' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
    get:
      summary: List catalog resources
      operationId: listCatalogResources
      tags: [Catalog]
      description: Authenticated bounded discovery ordered by (resource_type,resource_id). Hidden resources and denied lists do not enumerate owner state. Unknown or conflicting filters, cursor, page, offset, and continuation are rejected with 422.
      x-forbidden-query-parameters: [cursor, page, offset, continuation_token, next]
      parameters:
        - { $ref: '#/components/parameters/CatalogResourceType' }
        - { $ref: '#/components/parameters/CatalogOwnerId' }
        - { $ref: '#/components/parameters/CatalogStatus' }
        - { $ref: '#/components/parameters/CatalogVisibility' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Bounded catalog projection, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:resource-catalog-list:2.8.0' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }
  /v1/catalog/resources/{resource_type}/{id}:
    get:
      summary: Read a catalog resource
      operationId: readCatalogResource
      tags: [Catalog]
      description: Authentication precedes lookup. Hidden, absent, inactive, or filtered targets return the same 404 resource_not_found response.
      parameters:
        - { $ref: '#/components/parameters/CatalogResourceTypePath' }
        - { $ref: '#/components/parameters/CatalogId' }
      responses:
        '200': { description: Closed catalog projection, content: { application/json: { schema: { $ref: 'urn:sre-agent:schema:resource-catalog-entry:2.8.0' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
