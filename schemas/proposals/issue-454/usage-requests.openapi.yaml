openapi: 3.1.0
info:
  title: SRE Agent Historical Usage Requests
  version: 2.8.0
  description: >-
    Additive proposal for bounded administrator-only historical request attribution.
    Published releases, including 2.7.0, remain immutable.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/usage/requests:
    get:
      operationId: readUsageRequests
      summary: Read bounded historical request attribution
      description: >-
        Returns persisted per-request routing attribution and the authoritative
        existing consumption projection. Exactly one selector is required. Month
        is the canonical UTC month of the earliest persisted responses.create
        event; related rows are deduplicated by request_id. At most 1000 matching
        evidence rows are inspected; oversized scopes fail rather than truncate.
        Missing snapshots are reported as legacy and are never reconstructed from
        the current alias. Reads do not create attribution or consumption evidence.
      x-maximum-evidence-rows: 1000
      x-required-query-one-of: [request_id, incident_id, month]
      x-reject-unknown-query-parameters: true
      x-governed-scope:
        action: admin.read
        resource_type: administrative_control
        resource_id: usage
      x-forbidden-query-parameters:
        - from
        - to
        - cursor
        - page
        - offset
        - continuation_token
        - prompt
        - output
        - api_key
      parameters:
        - name: request_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
        - name: incident_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                minLength: 1
                maxLength: 128
              - type: 'null'
        - name: month
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: '^(?:(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-8][0-9]{3}|9[0-8][0-9]{2}|99[0-8][0-9]|999[0-8])-(?:0[1-9]|1[0-2])|9999-(?:0[1-9]|1[01]))$'
              - type: 'null'
      responses:
        '200':
          description: Persisted request attribution with explicit legacy/unavailable states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRequests'
        '401':
          description: Authentication failed; no request data or counts are returned.
          content:
            application/json:
              schema:
                $ref: 'urn:sre-agent:schema:error-envelope:2.7.0'
        '403':
          description: Administrative read is not authorized; no request data or counts are returned.
          content:
            application/json:
              schema:
                $ref: 'urn:sre-agent:schema:error-envelope:2.7.0'
        '413':
          description: The matching evidence exceeds the projection bound; no partial result is returned.
          content:
            application/json:
              schema:
                $ref: 'urn:sre-agent:schema:error-envelope:2.7.0'
        '422':
          description: Selector is missing, malformed, repeated, or supplied with unknown filters.
          content:
            application/json:
              schema:
                $ref: 'urn:sre-agent:schema:error-envelope:2.7.0'
        '503':
          description: Persisted request attribution could not be read; an empty result is not substituted.
          content:
            application/json:
              schema:
                $ref: 'urn:sre-agent:schema:error-envelope:2.7.0'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    UsageRequests:
      $id: urn:sre-agent:schema:usage-requests:2.8.0
      type: object
      additionalProperties: false
      required: [filter, items]
      properties:
        filter:
          type: object
          unevaluatedProperties: false
          oneOf:
            - type: object
              additionalProperties: false
              required: [request_id]
              properties:
                request_id: { type: string, format: uuid }
            - type: object
              additionalProperties: false
              required: [incident_id]
              properties:
                incident_id: { type: string, minLength: 1, maxLength: 128 }
            - type: object
              additionalProperties: false
              required: [month]
              properties:
                month: { type: string, pattern: '^(?:(?:000[1-9]|00[1-9][0-9]|0[1-9][0-9]{2}|[1-8][0-9]{3}|9[0-8][0-9]{2}|99[0-8][0-9]|999[0-8])-(?:0[1-9]|1[0-2])|9999-(?:0[1-9]|1[01]))$' }
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [request_id, month, requested_assignment, credited_model, credited_provider, attribution_status, consumption, navigation]
            properties:
              request_id: { type: string, format: uuid }
              month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
              requested_assignment:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [availability, alias, model, provider, router]
                    properties:
                      availability: { const: available }
                      alias: { type: string, minLength: 1, maxLength: 128 }
                      model: { type: string, pattern: '^[A-Za-z0-9._-]+/[A-Za-z0-9._:-]+$' }
                      provider: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
                      router: { type: string, minLength: 1, maxLength: 64 }
                  - type: object
                    additionalProperties: false
                    required: [availability, alias, model, provider, router]
                    properties:
                      availability: { const: unavailable }
                      alias: { const: null }
                      model: { const: null }
                      provider: { const: null }
                      router: { const: null }
              credited_model:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [availability, value]
                    properties:
                      availability: { const: available }
                      value: { type: string, pattern: '^[A-Za-z0-9._-]+/[A-Za-z0-9._:-]+$' }
                  - type: object
                    additionalProperties: false
                    required: [availability, value]
                    properties:
                      availability: { const: unavailable }
                      value: { const: null }
              credited_provider:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [availability, value]
                    properties:
                      availability: { const: available }
                      value: { type: string, pattern: '^[a-z][a-z0-9._-]{0,63}$' }
                  - type: object
                    additionalProperties: false
                    required: [availability, value]
                    properties:
                      availability: { const: unavailable }
                      value: { const: null }
              attribution_status: { enum: [available, partial, unavailable, legacy] }
              consumption:
                anyOf:
                  - $ref: 'urn:sre-agent:schema:consumption:2.7.0'
                  - type: 'null'
              navigation:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { const: unsupported }
            allOf:
              - if:
                  properties:
                    attribution_status: { const: available }
                then:
                  properties:
                    requested_assignment:
                      properties: { availability: { const: available } }
                    credited_model:
                      properties: { availability: { const: available } }
                    credited_provider:
                      properties: { availability: { const: available } }
              - if:
                  properties:
                    attribution_status: { const: legacy }
                then:
                  properties:
                    requested_assignment:
                      properties: { availability: { const: unavailable } }
                    credited_model:
                      properties: { availability: { const: unavailable } }
                    credited_provider:
                      properties: { availability: { const: unavailable } }
