openapi: 3.1.0
info:
  title: SRE Agent Usage Read API
  version: 2.5.0-draft.1
  description: >-
    Additive proposal for the administrator-only persisted consumption projection.
    It does not change the published 2.4.0 contract.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/usage/consumption:
    get:
      operationId: readUsageConsumption
      summary: Read persisted request consumption aggregates
      description: >-
        Reads only persisted consumption evidence. Exactly one bounded selector is
        required. Month selection uses the half-open UTC calendar interval from
        00:00:00Z on the first day through (but not including) the next month's
        first instant. An effective request is attributed only to the UTC month
        containing its earliest persisted responses.create occurred_at; all related
        rows for that request are included for deduplication and coverage, and later
        events do not create another month count. At most 1000 matching audit evidence rows are projected; a
        larger scope fails explicitly rather than returning a silently truncated
        aggregate. Reads do not create consumption evidence.
      x-maximum-evidence-rows: 1000
      x-required-query-one-of:
        - request_id
        - incident_id
        - month
      x-governed-scope:
        action: admin.read
        resource_type: administrative_control
        resource_id: usage
      parameters:
        - name: request_id
          in: query
          required: false
          description: Return the aggregate for one effective request.
          schema:
            type: string
            format: uuid
        - name: incident_id
          in: query
          required: false
          description: Return only the identified incident's distinct runs and requests.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: month
          in: query
          required: false
          description: UTC calendar month in YYYY-MM form.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      x-forbidden-query-parameters:
        - from
        - to
        - cursor
        - page
        - offset
        - continuation_token
        - prompt
        - output
        - api_key
      responses:
        '200':
          description: Persisted usage projection with explicit evidence coverage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRead'
        '401':
          description: Authentication failed; no usage data or counts are returned.
        '403':
          description: Administrative read is not authorized; no counts are returned.
        '422':
          description: Selector is missing, malformed, or supplied more than once.
        '413':
          description: The matching evidence exceeds the projection bound; no partial aggregate is returned.
        '503':
          description: Persisted usage could not be read; an empty result is not substituted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    UsageRead:
      $id: urn:sre-agent:schema:usage-read:2.5.0-draft.1
      type: object
      additionalProperties: false
      required: [filter, request_count, incident_runs, months, totals, coverage]
      properties:
        filter:
          oneOf:
            - type: object
              additionalProperties: false
              required: [request_id]
              properties:
                request_id: { type: string, format: uuid }
            - type: object
              additionalProperties: false
              required: [incident_id]
              properties:
                incident_id: { type: string, minLength: 1, maxLength: 128 }
            - type: object
              additionalProperties: false
              required: [month]
              properties:
                month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        request_count:
          type: integer
          minimum: 0
          description: Distinct effective requests, not audit-event rows.
        incident_runs:
          type: integer
          minimum: 0
          description: Distinct runs in the selected scope; zero when no incident applies.
        months:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [month, request_count]
            properties:
              month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
              request_count: { type: integer, minimum: 0 }
        totals:
          type: object
          additionalProperties: false
          required: [input_tokens, output_tokens, total_tokens, cost]
          properties:
            input_tokens: { type: [integer, 'null'], minimum: 0 }
            output_tokens: { type: [integer, 'null'], minimum: 0 }
            total_tokens: { type: [integer, 'null'], minimum: 0 }
            cost:
              type: object
              additionalProperties: false
              required: [amount, currency, nature, precision, price_versions]
              properties:
                amount:
                  type: [string, 'null']
                  pattern: '^(0|[1-9]\d*)(\.\d+)?$'
                  description: Exact billed USD decimal text; null when evidence cannot be combined.
                currency: { enum: [USD, null] }
                nature:
                  const: billed
                  description: The recorded value is billed provider cost, not an estimate.
                precision: { enum: [exact, null] }
                price_versions:
                  type: array
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 128 }
        coverage:
          type: object
          additionalProperties: false
          required: [status, known, incomplete, unknown]
          properties:
            status: { enum: [complete, partial, unknown] }
            known: { type: integer, minimum: 0 }
            incomplete: { type: integer, minimum: 0 }
            unknown: { type: integer, minimum: 0 }
