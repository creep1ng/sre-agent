# Disposable Issue 29 counter overlay. Compose project-scoped network; no host ports.
services:
  api:
    image: ${COMPOSE_PROJECT_NAME:?Set a unique Compose project with -p}-api-runtime:local

  grafana-mcp:
    image: ${COMPOSE_PROJECT_NAME:?Set a unique Compose project with -p}-api-runtime:local
    entrypoint: ["python", "/instrument/issue29_counting_relay.py"]
    environment:
      ISSUE29_BIND_HOST: 0.0.0.0
      ISSUE29_BIND_PORT: "8000"
      ISSUE29_UPSTREAM_URL: http://mcp-upstream:8000
    volumes:
      - ./scripts/issue29_counting_relay.py:/instrument/issue29_counting_relay.py:ro
    networks: [mcp-boundary]
    depends_on:
      mcp-upstream:
        condition: service_started

  mcp-upstream:
    image: grafana/mcp-grafana:1.3.0@sha256:5114852743e450fe5186b6c1712419843eb4bd295e47e64c452c3aa0fab3c42e
    command:
      ["--transport=streamable-http", "--address=0.0.0.0:8000",
       "--allowed-hosts=mcp-upstream:8000", "--disable-write",
       "--enabled-tools=prometheus,elasticsearch,datasource"]
    env_file:
      - ${DEMO_STATE_DIR:?DEMO_STATE_DIR is required}/grafana-mcp.env
    environment:
      # Intentionally inert backend: no external Grafana service is contacted.
      GRAFANA_URL: http://127.0.0.1:1
    networks: [mcp-boundary]

networks:
  # Replaces compose.mcp.yaml's globally named external network. Both API and
  # relay join a network whose name is isolated by the explicit Compose project.
  mcp-boundary:
    name: ${COMPOSE_PROJECT_NAME:?Set a unique Compose project with -p}-mcp-boundary
    external: false
