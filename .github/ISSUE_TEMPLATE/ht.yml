name: Historia técnica (HT)
description: Trabajo técnico con resultado, entregables y criterios verificables
title: "[HT-XX] "
labels:
  - "type: technical task"
body:
  - type: textarea
    id: technical_problem
    attributes:
      label: Problema técnico que desbloquea
      description: Qué ambigüedad, dependencia o capacidad técnica impide avanzar.
    validations:
      required: true
  - type: textarea
    id: observable_result
    attributes:
      label: Resultado observable
      description: Qué debe existir o poder demostrarse al cerrar la HT.
    validations:
      required: true
  - type: textarea
    id: affected_contracts
    attributes:
      label: Contratos / interfaces afectados
      description: API, schema, DB, workflow, UI contract, ADR u otras superficies afectadas.
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Entregables
      description: Archivos, endpoints, migraciones, ADRs, pruebas o fixtures esperados.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Criterios de aceptación
      description: Incluí criterios específicos y verificables, casos positivos y casos negativos.
    validations:
      required: true
  - type: textarea
    id: acceptance_evidence
    attributes:
      label: Evidencia de aceptación
      description: Comandos, pruebas, capturas, requests/responses o demo esperada.
    validations:
      required: true
  - type: checkboxes
    id: definition_of_ready
    attributes:
      label: Definition of Ready
      options:
        - label: Resultado y valor técnico están claros.
          required: true
        - label: Contratos e interfaces afectados están identificados.
          required: true
        - label: Dependencias y riesgos están identificados.
          required: true
        - label: Los criterios son verificables.
          required: true
        - label: Cabe en el sprint o está dividida.
          required: true
        - label: No depende de una decisión abierta sin owner y fecha.
          required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Fuera de alcance
      description: Qué explícitamente no se construye en esta HT.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias
      description: Indicá de qué depende y qué desbloquea.
    validations:
      required: true
  - type: textarea
    id: open_decisions
    attributes:
      label: Decisiones abiertas
      description: Si aplica, incluí responsable y fecha objetivo. Escribí "Ninguna" cuando no existan.
    validations:
      required: true
  - type: textarea
    id: planning
    attributes:
      label: Planificación
      description: Incluí Sprint, SP, responsable, épica y si pertenece a la ruta crítica.
    validations:
      required: true
  - type: markdown
    attributes:
      value: El Definition of Done se verifica en la Pull Request. Para trabajo sin código puede aplicarse la excepción de cierre basada en evidencia definida por el proyecto.
