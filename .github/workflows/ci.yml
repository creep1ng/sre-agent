name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only changes documentation no code reads skips every build and test
  # job, and one that changes no contract input skips contracts. Pushes to main and scheduled
  # runs always run them all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      contracts: ${{ steps.classify.outputs.contracts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the changed paths
        id: classify
        run: |
          docs_only=false
          contracts=true
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            # The pull_request checkout is the merge commit; its first parent is the base.
            changed="$(git diff --name-only HEAD^1 HEAD)"
            docs_only=true
            [ -n "${changed}" ] || docs_only=false
            while IFS= read -r path; do
              [ -n "${path}" ] || continue
              case "${path}" in
                docs/*) ;;
                */*) docs_only=false; continue ;;
                *.md) ;;
                *) docs_only=false; continue ;;
              esac
              # A document that code, tests or tooling name is an input, not documentation.
              if git grep -qF -e "${path}" -- ':!docs/' ':!*.md'; then
                echo "${path} is read outside the documentation"
                docs_only=false
              fi
            done <<< "${changed}"
            # The contract harness reads only schemas/, through its image and Compose service.
            if ! grep -qE '^(schemas/|docker/harness|compose\.yaml$|\.github/workflows/ci\.yml$)' <<< "${changed}"; then
              contracts=false
            fi
            printf '%s\n' "${changed}"
          fi
          echo "docs_only=${docs_only} contracts=${contracts}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "contracts=${contracts}" >> "${GITHUB_OUTPUT}"

  configuration-lock:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the locked runtime candidate
        run: docker build --target runtime --tag sre-agent-runtime:${{ github.sha }} -f docker/api.Dockerfile .

  checks-image:
    needs: configuration-lock
    if: ${{ always() && (github.event_name == 'schedule' || needs.configuration-lock.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the locked checks image
        run: docker build --target checks --tag sre-agent-checks:${{ github.sha }} -f docker/api.Dockerfile .
      - name: Run formatting, architecture, typing and declarative checks
        run: >-
          docker run --rm
          -e TEST_DATABASE_URL=postgresql://python_checks@checks-db:5432/python_checks
          -e DEMO_DATABASE_URL=postgresql://demo@demo-db:5432/demo
          sre-agent-checks:${{ github.sha }} sh -c
          'python scripts/assert_test_database_isolated.py &&
          shellcheck docker/harness-entrypoint.sh scripts/worktree-compose scripts/run_real_journeys.sh &&
          ruff check --no-cache . && ruff format --check --no-cache . &&
          uv lock --check --no-cache && lint-imports --no-cache &&
          mypy --cache-dir=/tmp/mypy src/sre_agent/incident/persistence.py src/sre_agent/incident/runtime.py
          src/sre_agent/governance/dto.py src/sre_agent/governance/authorization.py
          src/sre_agent/investigator &&
          python scripts/validate_incident_contracts.py &&
          python scripts/validate_incident_authorization.py &&
          python scripts/validate_run_api.py && python scripts/validate_incident_queries.py &&
          python scripts/validate_ci_hardening.py'

  unit:
    needs: checks-image
    if: ${{ always() && (github.event_name == 'schedule' || needs.checks-image.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: ${{ github.event_name == 'pull_request' && '--maxfail=1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create local-only Compose inputs
        run: cp .env.example .env
      - name: Run the locked Python checks container
        run: docker compose --project-name ci-unit-${{ github.run_id }} --profile checks run --build --rm -e "PYTEST_ADDOPTS=-p no:cacheprovider ${{ env.PYTEST_ADDOPTS }}" python-checks
      - name: Remove disposable check services
        if: always()
        run: docker compose --project-name ci-unit-${{ github.run_id }} --profile checks down -v --remove-orphans

  contracts:
    needs: [changes, checks-image]
    if: ${{ always() && needs.changes.outputs.contracts != 'false' && (github.event_name == 'schedule' || needs.checks-image.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      # A pinned digest never changes, so rewriting a release together with its lock entry still fails.
      - name: Keep every published release digest pinned
        if: ${{ github.event_name != 'schedule' }}
        run: |
          git show HEAD^1:schemas/releases.lock.json > "${RUNNER_TEMP}/base-releases.lock.json" 2>/dev/null ||
            echo '{}' > "${RUNNER_TEMP}/base-releases.lock.json"
          jq -en --slurpfile base "${RUNNER_TEMP}/base-releases.lock.json" --slurpfile head schemas/releases.lock.json \
            '$base[0] | to_entries | all(.value == $head[0][.key])' ||
            { echo "::error::schemas/releases.lock.json changed or removed a published release digest"; exit 1; }
      - name: Create local-only Compose inputs
        run: cp .env.example .env
      # Pull requests and pushes validate the newest release in full and pin the older ones by
      # digest; the schedule revalidates every published release.
      - name: Run locked contract tooling in its container
        env:
          RELEASES: ${{ github.event_name == 'schedule' && 'validate:releases' || 'validate:releases:locked' }}
        run: >-
          docker compose --project-name ci-contracts-${{ github.run_id }} --profile harness run --build --rm harness
          sh -c "npm --prefix schemas/tooling test && npm --prefix schemas/tooling run validate &&
          npm --prefix schemas/tooling run ${RELEASES} && npm --prefix schemas/tooling run lint:openapi"
      - name: Remove disposable contract services
        if: always()
        run: docker compose --project-name ci-contracts-${{ github.run_id }} --profile harness down -v --remove-orphans

  static-web:
    needs: checks-image
    if: ${{ always() && (github.event_name == 'schedule' || needs.checks-image.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/showcase.js
      - run: test -f index.html && test -f styles/design-system.css
      - name: Run static showcase browser smoke
        run: npm run test:browser

  # The composed stack builds its own images, so it runs alongside unit and contracts.
  compose-smoke:
    needs: checks-image
    if: ${{ always() && (github.event_name == 'schedule' || needs.checks-image.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create ephemeral seed inputs
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          from secrets import token_hex

          path = Path(".env")
          content = path.read_text()
          replacements = {
              "<set-unique-sre_-prefixed-key-with-32-plus-characters>": (
                  f"sre_admn_{token_hex(16)}", f"sre_demo_{token_hex(16)}",
                  f"sre_inci_{token_hex(16)}", f"sre_rest_{token_hex(16)}",
              ),
              "<lab/model>": ("openai/gpt-4o-mini", "anthropic/claude-sonnet-4"),
              "<provider>": ("openai", "anthropic"),
              "<set-long-random-executor-signing-key>": (token_hex(32),),
          }
          for placeholder, values in replacements.items():
              for value in values:
                  content = content.replace(placeholder, value, 1)
          path.write_text(content)
          PY
      - name: Start the real candidate stack
        run: docker compose --project-name ci-smoke-${{ github.run_id }} up --build --wait
      - name: Verify API, web, and contract harness
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent http://127.0.0.1:8080/health
          docker compose --project-name ci-smoke-${{ github.run_id }} --profile harness run --rm harness
          docker compose --project-name ci-smoke-${{ github.run_id }} --profile issue-14 run --build --rm issue-14-harness
      - name: Collect sanitised service state
        if: failure()
        run: docker compose --project-name ci-smoke-${{ github.run_id }} ps
      - name: Remove the scoped stack
        if: always()
        run: docker compose --project-name ci-smoke-${{ github.run_id }} down -v --remove-orphans

  production-browser:
    needs: compose-smoke
    if: ${{ always() && (github.event_name == 'schedule' || needs.compose-smoke.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create ephemeral browser inputs
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          from secrets import token_hex

          path = Path(".env")
          content = path.read_text()
          for value in (f"sre_admn_{token_hex(16)}", f"sre_demo_{token_hex(16)}", f"sre_inci_{token_hex(16)}", f"sre_rest_{token_hex(16)}"):
              content = content.replace("<set-unique-sre_-prefixed-key-with-32-plus-characters>", value, 1)
          content = content.replace("<lab/model>", "openai/gpt-4o-mini", 1).replace("<lab/model>", "anthropic/claude-sonnet-4", 1)
          content = content.replace("<provider>", "openai", 1).replace("<provider>", "anthropic", 1)
          content = content.replace("<set-long-random-audit-hmac-key>", token_hex(32), 1)
          path.write_text(content)
          PY
      - name: Build and wait for production images only
        run: docker compose -f compose.yaml -f compose.e2e.yaml --project-name ci-browser-${{ github.run_id }} up --build --wait db api web
      - name: Run browser journeys against candidate images
        run: docker compose -f compose.yaml -f compose.e2e.yaml --project-name ci-browser-${{ github.run_id }} --profile e2e run --build --rm e2e
      - name: Verify a bad proxy fails the browser journey
        run: |
          docker compose -f compose.yaml -f compose.e2e.yaml --project-name ci-browser-${{ github.run_id }} --profile e2e-negative up --build --wait web-bad-proxy
          if docker compose -f compose.yaml -f compose.e2e.yaml --project-name ci-browser-${{ github.run_id }} --profile e2e-negative run --build --rm e2e-bad-proxy; then
            echo "Bad proxy unexpectedly passed the browser assertion."
            exit 1
          fi
      - name: Record candidate image identities
        if: always()
        run: |
          {
            echo "pr-head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "base=${{ github.event.pull_request.base.sha || github.sha }}"
            echo "github-sha=${GITHUB_SHA}"
            docker image inspect --format '{{.Id}}' ci-browser-${{ github.run_id }}-api ci-browser-${{ github.run_id }}-web 2>/dev/null || true
          } > ci-image-identities.txt
      - name: Retain sanitised image identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-image-identities-${{ github.sha }}
          path: ci-image-identities.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove the scoped browser stack
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml --project-name ci-browser-${{ github.run_id }} down -v --remove-orphans

  real-journeys:
    needs: compose-smoke
    if: ${{ always() && (github.event_name == 'schedule' || needs.compose-smoke.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create ephemeral browser inputs
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          from secrets import token_hex

          path = Path(".env")
          content = path.read_text()
          for value in (f"sre_admn_{token_hex(16)}", f"sre_demo_{token_hex(16)}", f"sre_inci_{token_hex(16)}", f"sre_rest_{token_hex(16)}"):
              content = content.replace("<set-unique-sre_-prefixed-key-with-32-plus-characters>", value, 1)
          content = content.replace("<lab/model>", "openai/gpt-4o-mini", 1).replace("<lab/model>", "anthropic/claude-sonnet-4", 1)
          content = content.replace("<provider>", "openai", 1).replace("<provider>", "anthropic", 1)
          content = content.replace("<set-long-random-audit-hmac-key>", token_hex(32), 1)
          path.write_text(content)
          PY
      - name: Run the seeded real-stack incident journeys without a model provider
        env:
          COMPOSE_PROJECT_NAME: ci-journeys-${{ github.run_id }}
        run: scripts/run_real_journeys.sh incidents
      - name: Remove the scoped journeys stack
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml --project-name ci-journeys-${{ github.run_id }} --profile e2e down -v --remove-orphans

  triage-review:
    needs: compose-smoke
    if: ${{ always() && (github.event_name == 'schedule' || needs.compose-smoke.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the 55 seeded T23 triage journeys on their isolated stack
        run: scripts/run_triage23_review.sh

  deploy-executor:
    needs: compose-smoke
    if: ${{ always() && (github.event_name == 'schedule' || needs.compose-smoke.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create ephemeral executor inputs
        run: |
          cp .env.example .env
          sed -i "s/^DEPLOY_EXECUTOR_SIGNING_KEY=.*/DEPLOY_EXECUTOR_SIGNING_KEY=$(openssl rand -hex 32)/" .env
      - name: Run the deploy-executor journey and its socket-down case
        env:
          COMPOSE_PROJECT_NAME: ci-executor-${{ github.run_id }}
        run: scripts/run_real_journeys.sh executor
      - name: Remove the scoped executor stack
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml --project-name ci-executor-${{ github.run_id }} --profile executor-e2e down -v --remove-orphans

  quality-gate:
    name: Quality gate
    needs:
      - changes
      - configuration-lock
      - checks-image
      - unit
      - contracts
      - static-web
      - compose-smoke
      - production-browser
      - real-journeys
      - triage-review
      - deploy-executor
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      CONTRACTS_NEEDED: ${{ needs.changes.outputs.contracts }}
      CONFIGURATION_LOCK_RESULT: ${{ needs.configuration-lock.result }}
      CHECKS_IMAGE_RESULT: ${{ needs.checks-image.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      CONTRACTS_RESULT: ${{ needs.contracts.result }}
      STATIC_WEB_RESULT: ${{ needs.static-web.result }}
      COMPOSE_SMOKE_RESULT: ${{ needs.compose-smoke.result }}
      PRODUCTION_BROWSER_RESULT: ${{ needs.production-browser.result }}
      REAL_JOURNEYS_RESULT: ${{ needs.real-journeys.result }}
      TRIAGE_REVIEW_RESULT: ${{ needs.triage-review.result }}
      DEPLOY_EXECUTOR_RESULT: ${{ needs.deploy-executor.result }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Create sanitised CI summary
        if: always()
        run: |
          cat > quality-gate-summary.txt <<EOF
          pr-head=${PR_HEAD_SHA}
          base=${BASE_SHA}
          github-sha=${GITHUB_SHA}
          event=${GITHUB_EVENT_NAME}
          changes=${CHANGES_RESULT}
          docs-only=${DOCS_ONLY}
          contracts-needed=${CONTRACTS_NEEDED}
          configuration-lock=${CONFIGURATION_LOCK_RESULT}
          checks-image=${CHECKS_IMAGE_RESULT}
          unit=${UNIT_RESULT}
          contracts=${CONTRACTS_RESULT}
          static-web=${STATIC_WEB_RESULT}
          compose-smoke=${COMPOSE_SMOKE_RESULT}
          production-browser=${PRODUCTION_BROWSER_RESULT}
          real-journeys=${REAL_JOURNEYS_RESULT}
          triage-review=${TRIAGE_REVIEW_RESULT}
          deploy-executor=${DEPLOY_EXECUTOR_RESULT}
          EOF
      - name: Retain sanitised CI summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-summary-${{ github.sha }}
          path: quality-gate-summary.txt
          if-no-files-found: error
          retention-days: 30
      - name: Require every mandatory job to succeed
        run: |
          failures=0
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "changes ended as ${CHANGES_RESULT}; quality gate requires success."
            exit 1
          fi
          # Only a documentation-only pull request may skip, and then every job must have skipped.
          expected=success
          if [ "${DOCS_ONLY}" = "true" ]; then expected=skipped; fi
          for result in \
            "configuration-lock:${CONFIGURATION_LOCK_RESULT}" \
            "checks-image:${CHECKS_IMAGE_RESULT}" \
            "unit:${UNIT_RESULT}" \
            "contracts:${CONTRACTS_RESULT}" \
            "static-web:${STATIC_WEB_RESULT}" \
            "compose-smoke:${COMPOSE_SMOKE_RESULT}" \
            "production-browser:${PRODUCTION_BROWSER_RESULT}" \
            "real-journeys:${REAL_JOURNEYS_RESULT}" \
            "triage-review:${TRIAGE_REVIEW_RESULT}" \
            "deploy-executor:${DEPLOY_EXECUTOR_RESULT}"; do
            job="${result%%:*}"
            status="${result#*:}"
            required="${expected}"
            # A pull request that changes no contract input skips only contracts.
            if [ "${job}" = contracts ] && [ "${CONTRACTS_NEEDED}" = "false" ]; then required=skipped; fi
            if [ "${status}" != "${required}" ]; then
              echo "${job} ended as ${status}; quality gate requires ${required}."
              failures=1
            fi
          done
          exit "${failures}"
