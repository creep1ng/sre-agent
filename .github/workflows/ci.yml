name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Run database-independent Python tests
        run: >-
          pytest
          --ignore=tests/test_migrations.py
          --ignore=tests/test_persistence_repositories.py

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schemas/tooling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: schemas/tooling/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run validate:release -- --release 1.0.0
      - run: npm run validate:release -- --release 1.1.0
      - run: npm run lint:openapi
      - run: npm run conformance -- --consumer issue-10

  issue-11-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: sre_agent
          POSTGRES_USER: sre_agent
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sre_agent -d sre_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sre_agent:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/sre_agent
      TEST_DATABASE_URL: postgresql://sre_agent:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/sre_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: schemas/tooling/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head && alembic upgrade head
      - name: Run PostgreSQL-backed Python tests
        run: >-
          pytest -q
          tests/test_migrations.py
          tests/test_persistence_repositories.py
          tests/test_health.py
      - run: alembic check
      - run: npm --prefix schemas/tooling ci
      - run: npm --prefix schemas/tooling run conformance -- --consumer issue-11

  static-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
      - run: node --check scripts/showcase.js
      - run: test -f index.html && test -f styles/design-system.css

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral seed inputs
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          from secrets import token_hex

          path = Path(".env")
          content = path.read_text()
          replacements = {
              "<set-unique-sre_-prefixed-key-with-32-plus-characters>": (
                  f"sre_admn_{token_hex(16)}",
                  f"sre_demo_{token_hex(16)}",
                  f"sre_inci_{token_hex(16)}",
                  f"sre_rest_{token_hex(16)}",
              ),
              "<lab/model>": ("openai/gpt-4o-mini",),
              "<provider>": ("openai",),
          }
          for placeholder, values in replacements.items():
              for value in values:
                  content = content.replace(placeholder, value, 1)
          path.write_text(content)
          PY
      - name: Start the local stack
        run: docker compose up --build --wait
      - name: Verify API, web, and contract harness
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent http://127.0.0.1:8080/health
          docker compose --profile harness run --rm harness
      - name: Collect service logs
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Remove the stack
        if: always()
        run: docker compose down -v --remove-orphans
