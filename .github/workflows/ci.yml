name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create local-only Compose inputs
        run: cp .env.example .env
      - name: Run the documented Python checks
        run: docker compose --profile checks run --build --rm python-checks
      - name: Remove disposable check services
        if: always()
        run: docker compose --profile checks down -v --remove-orphans

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Validate declarative incident contracts
        run: python scripts/validate_incident_contracts.py
      - name: Validate incident authorization vocabulary
        run: python scripts/validate_incident_authorization.py
      - name: Validate CI hardening controls
        run: python scripts/validate_ci_hardening.py
      - name: Run database-independent Python tests
        run: >-
          pytest
          --ignore=tests/test_migrations.py
          --ignore=tests/test_persistence_repositories.py
          --ignore=tests/test_demo_seeds.py
          --ignore=tests/test_api_key_persistence.py
          --ignore=tests/test_authentication.py
          --ignore=tests/test_responses.py
          --ignore=tests/test_openrouter_live.py

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: schemas/tooling
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: schemas/tooling/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run validate:releases
      - run: npm run lint:openapi

  issue-11-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_DB: sre_agent
          POSTGRES_USER: sre_agent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sre_agent -d sre_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sre_agent@127.0.0.1:5432/sre_agent
      TEST_DATABASE_URL: postgresql://sre_agent@127.0.0.1:5432/sre_agent
      TRIAGE_AGENT_MODEL: openai/gpt-4o-mini
      TRIAGE_AGENT_PROVIDER: openai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: schemas/tooling/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Create ephemeral seed inputs
        run: |
          python - <<'PY'
          import os
          import secrets

          names = (
              "ADMIN_HUMAN_API_KEY",
              "DEMO_HUMAN_API_KEY",
              "INCIDENT_HARNESS_API_KEY",
              "RESTRICTED_HARNESS_API_KEY",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for index, name in enumerate(names):
                  output.write(f"{name}=sre_{index:04d}_{secrets.token_hex(16)}\n")
          PY
      - run: alembic upgrade head && alembic upgrade head
      - run: python -m sre_agent.persistence.seeds
      - run: python -m sre_agent.persistence.seeds
      - name: Show issue 27 Responses credential matrix evidence
        run: pytest -vv tests/test_responses.py::test_public_responses_credential_matrix
      - name: Run PostgreSQL-backed Python tests
        run: >-
          pytest -q
          tests/test_migrations.py
          tests/test_persistence_repositories.py
          tests/test_demo_seeds.py
          tests/test_api_key_persistence.py
          tests/test_authentication.py
          tests/test_health.py
          tests/test_audit.py
          tests/test_responses.py
          --deselect=tests/test_responses.py::test_public_responses_credential_matrix
      - run: alembic check
      - run: npm --prefix schemas/tooling ci
      - run: npm --prefix schemas/tooling run conformance -- --consumer issue-11

  static-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check scripts/showcase.js
      - run: test -f index.html && test -f styles/design-system.css
      - name: Run browser smoke
        run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: ignore
          retention-days: 7

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create ephemeral seed inputs
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          from secrets import token_hex

          path = Path(".env")
          content = path.read_text()
          replacements = {
              "<set-unique-sre_-prefixed-key-with-32-plus-characters>": (
                  f"sre_admn_{token_hex(16)}",
                  f"sre_demo_{token_hex(16)}",
                  f"sre_inci_{token_hex(16)}",
                  f"sre_rest_{token_hex(16)}",
              ),
              "<lab/model>": ("openai/gpt-4o-mini",),
              "<provider>": ("openai",),
          }
          for placeholder, values in replacements.items():
              for value in values:
                  content = content.replace(placeholder, value, 1)
          path.write_text(content)
          PY
      - name: Start the local stack
        run: docker compose up --build --wait
      - name: Verify API, web, and contract harness
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent http://127.0.0.1:8080/health
          docker compose --profile harness run --rm harness
          docker compose --profile issue-14 run --build --rm issue-14-harness
      - name: Collect service logs
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Remove the stack
        if: always()
        run: docker compose down -v --remove-orphans
