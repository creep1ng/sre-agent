# Live-triage E2E (#703, #704): real API, database, web proxy and new console. The model concludes
# at once (or after $LIVE_TRIAGE_FAULTS/model-delay seconds) and the Grafana MCP stand-in fires
# every alert rule to intake (#765) unless $LIVE_TRIAGE_FAULTS/{rule id} reads `ok`
# (scripts/live_triage_upstreams.py). Intake has no operator here, so the episodes stay `new` for
# the console.
# Each live spec opens its own fresh episodes (web/incident-console/e2e/live-faults.ts). With .env
# and .env.worktree, F="-f compose.e2e.yaml -f compose.live-triage-e2e.yaml":
#   scripts/worktree-compose $F up --build --wait db api web incident-console
#   scripts/worktree-compose $F run --rm --no-deps -T seed python -m sre_agent.persistence.seeds --seed-mcp
#   scripts/worktree-compose $F run --rm --no-deps -T seed python /e2e/provision_demo.py
#   DISPATCH_RECOVERY=interrupt scripts/worktree-compose $F --profile e2e run --build --rm --no-deps \
#     incident-console-e2e npx playwright test e2e/dispatch-recovery-live.spec.ts
#   scripts/worktree-compose $F kill api && scripts/worktree-compose $F up -d --wait api
#   DISPATCH_RECOVERY=interrupted ...   # same run command
#   scripts/worktree-compose $F down -v --remove-orphans
services:
  api:
    command: ["python", "/e2e/live_triage_upstreams.py"]
    volumes:
      - ./scripts/live_triage_upstreams.py:/e2e/live_triage_upstreams.py:ro
      - ${LIVE_TRIAGE_FAULTS:-/tmp/live-triage-faults}:/fault:ro
    environment:
      ALERT_INTAKE_GRAFANA_SECRET: live-triage-intake-secret-0123456789
      ALERT_INTAKE_PRINCIPAL_ID: ""

  seed:
    volumes: ["./scripts:/e2e:ro"]
    environment: {AUDIT_HMAC_KEY: "${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}"}

  incident-console-e2e:
    environment:
      ADMIN_HUMAN_API_KEY: ${ADMIN_HUMAN_API_KEY:?ADMIN_HUMAN_API_KEY is required}
      LIVE_DECLARE: ${LIVE_DECLARE:-0}
      LIVE_TRIAGE: ${LIVE_TRIAGE:-}
      AUTO_INVESTIGATE: ${AUTO_INVESTIGATE:-}
      DISPATCH_RECOVERY: ${DISPATCH_RECOVERY:-}
      FAULT_DIR: /fault
    volumes:
      - ${LIVE_TRIAGE_FAULTS:-/tmp/live-triage-faults}:/fault
