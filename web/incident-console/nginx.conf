server {
  listen 80;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes (/app/incidentes/...) fall back to the app shell.
  location /app/ {
    try_files $uri /app/index.html;
  }
}
